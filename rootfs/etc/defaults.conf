# Board defaults, read-only.  This file ships inside the rootfs, so changing it
# means editing the tree and rebuilding (there is no on-board write path).  The
# init scripts read it with "sed", so values are data only: no shell expansion,
# no quotes, no spaces around '='.
HOSTNAME=n32h787
# dhcp (default) | static | off.
NETWORK_MODE=dhcp
# slaac (default) | dhcp6 | off.
NETWORK_IPV6=slaac
NETWORK_IFACE=eth0
IPV4_ADDRESS=192.168.10.2/24
IPV4_GATEWAY=192.168.10.1
DNS1=1.1.1.1
# Remote login via inetd: off | telnet | ssh | both.  Telnet is cleartext.
REMOTE_LOGIN=both
# Development USB root shell, without authentication: on | off.
USB_ADB=on
USB_ADB_UDC=40100000.usb
