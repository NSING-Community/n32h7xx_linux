# Format: DEVNAME_REGEX  UID:GID PERM  @|$|*PROG   (@ add, $ remove, * both)
# First match wins, so keep specific patterns first.
# * = /usr/sbin/mdev-automount, which auto-mounts removable cards.

# SD/MMC partitions, then the whole disk for partition-table-less cards.
mmcblk[0-9]+p[0-9]+	0:0 660	* /usr/sbin/mdev-automount
mmcblk[0-9]+	0:0 660	* /usr/sbin/mdev-automount

sd[a-z][0-9]+	0:0 660	* /usr/sbin/mdev-automount
sd[a-z]	0:0 660	* /usr/sbin/mdev-automount
