# N32H7xx dual-core debug (Cortex-M7 + Cortex-M4) over one SWD-DAP:
# M7 = AP0, M4 = AP2.  Both cores must share ONE OpenOCD instance -- a
# second one cannot open the same CMSIS-DAP probe.  GDB ports:
#     gdb_port -> M7 (AP0)        gdb_port + 1 -> M4 (AP2)
# Base defaults to 3333.
#     openocd -f OpenocdCfg/n32h7xx_dual_cmsisdap.cfg
#
# No flash algorithm, on purpose: flashing stays with the single-core
# configs -- stop this session first (one probe, one OpenOCD).
#
# Ports are handed out in target creation order, so the M7 target must
# stay first (M7 = base, M4 = base + 1).  DO NOT REORDER.

# --- CMSIS-DAP Interface ---
adapter driver cmsis-dap

# NSLink 0x19F5/0x3106; stock CMSIS-DAP 0xC251/0xF001; DAPLink 0x0D28/0x0204
if {![info exists ADAPTER_VID]} { set ADAPTER_VID 0x19F5 }
if {![info exists ADAPTER_PID]} { set ADAPTER_PID 0x3106 }
if {[catch {adapter usb vid_pid $::ADAPTER_VID $::ADAPTER_PID}]} {
    cmsis_dap_vid_pid $::ADAPTER_VID $::ADAPTER_PID
}

transport select swd

source [find mem_helper.tcl]           ;# mrw/mww/mdw


adapter speed 1000

## NTFx CODE START ##
# --- Target: N32H787XIB7 (Cortex-M7 + Cortex-M4) ---
set _CHIPNAME n32h7xx
## NTFx CODE END ##
set _ENDIAN little

# --- Debug Port ---
# Pin both IDCODEs this part reports (one per core's view of the DAP);
# -expected-id is repeatable and a match against any of them is accepted.
swd newdap $_CHIPNAME dap -irlen 4 -ircapture 0x1 -irmask 0xf \
    -expected-id 0x5BA02477 -expected-id 0x2BA01477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.dap

# --- Targets ---
# Both deferred: a CM4 held in reset-hold stalls every AP2 access, so
# `init` must not auto-examine it.  Bring-up order lives in
# _N32H7xx_dual_connect, which runs at the end of `init`.
set _M7TGT $_CHIPNAME.m7
set _M4TGT $_CHIPNAME.m4
set _M4SUFFIX [lindex [split $_M4TGT .] end]

target create $_M7TGT cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 0 -defer-examine
target create $_M4TGT cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 2 -defer-examine

# --- Reset config ---
# `reset` is overridden below (boot-aware M7 / VECTRESET M4).  sysresetreq
# is for the M7 only -- the M4's system reset drops the WHOLE chip.
reset_config srst_nogate

targets $_M7TGT
if {![using_hla]} {
    cortex_m reset_config sysresetreq
}

# Delay before the first examination so a connected nRESET wire cannot break
# `init`: NSLink toggles its nRESET pin during DAP_Connect, which pin-resets the
# target, and the examination that follows lands in the ~100 ms boot window where
# AHB-AP accesses fault ("Failed to read memory at 0xe000ed00"). Measured on this
# board: 0-80 ms fails, >=120 ms passes. 0 = off (4-wire SWD, no nRESET wire).
# Applied in _N32H7xx_dual_connect, NOT via an examine-start event: arp_examine calls
# target->type->examine() directly and never fires that event.
set N32H7_EXAMINE_DELAY_MS 200

# Per-target, so the M4 detaching never disturbs a running M7.  The M4
# gets no blind `halt` -- its target is stale after the M7's whole-chip
# reset; N32H7xx_m4_gdb_attach re-establishes it and leaves it running.
$_M7TGT configure -event gdb-attach {
    halt 1000
}
$_M7TGT configure -event gdb-detach {
    resume
}
$_M4TGT configure -event gdb-attach {
    N32H7xx_m4_gdb_attach
}
$_M4TGT configure -event gdb-detach {
    resume
}

# --- Register map ---
# SCS/Debug entries are per-core: same address, reached through the
# current target's AP.
#   AIRCR    0xE000ED0C   bit2 SYSRESETREQ, bit0 VECTRESET
#   DHCSR    0xE000EDF0
#   DEMCR    0xE000EDFC   bit0 VC_CORERESET
#   FP_CTRL  0xE0002000   FP_COMP0 0xE0002008
# M7 bus side -- only reachable while the M7 target is current:
#   0x58030174  RCC->M4RSTREL, bit0 = 1 -> CM4 released
set N32H7_DBG_DHCSR    0xE000EDF0
set N32H7_DBG_DEMCR    0xE000EDFC
set N32H7_SCS_AIRCR    0xE000ED0C
set N32H7_FPB_CTRL     0xE0002000
set N32H7_FPB_COMP0    0xE0002008
set N32H7_CM4_RELEASE  0x58030174

# Settle after releasing the CM4, before AP2 is touched.  A whole-chip
# reset took its clock/power domain down; an early AP2 access stalls the
# link.
set N32H7_CM4_SETTLE_MS 50

# This SoC runs a masked boot ROM before the user app.
set N32H7_STORE_ADDR  0x5110511c       ;# MMU M7_StoreAddr_cur (app vector table base)
set N32H7_BOOT_WAIT_MS 500             ;# ms to let boot reach the app

# ============================================================
# Target selection helpers
# ============================================================
proc _use_m7 {} {
    global _M7TGT
    catch {targets $_M7TGT}
}
proc _use_m4 {} {
    global _M4TGT
    catch {targets $_M4TGT}
}

# `targets` sets cmd_ctx->current_target, and that context belongs to the
# GDB connection that issued the `monitor` command.  A proc that switches
# core without switching back hijacks the OTHER session's next monitor
# command -- `reset` included.  Always save/restore through
# _dual_enter / _dual_leave; never call _use_m7 / _use_m4 at proc scope.
proc _dual_current_target {} {
    if {[catch {capture "targets"} _tbl]} {
        return ""
    }
    foreach _line [split $_tbl "\n"] {
        if {[regexp {\*\s+(\S+)} _line -> _name]} {
            return $_name
        }
    }
    return ""
}

# Returns "" if the core could not be told; _dual_leave then falls back to
# the M7 (primary core, and where a fresh connection starts).
proc _dual_enter {} {
    set _saved [_dual_current_target]
    return $_saved
}

proc _dual_leave {saved} {
    if {$saved ne ""} {
        catch {targets $saved}
    } else {
        _use_m7
    }
}

# Release the CM4 from reset-hold (RCC->M4RSTREL, M7 bus side -- the
# caller must make the M7 current first).  Does not switch or
# save/restore targets.  0 = ok, 1 = failed.
proc _N32H7xx_cm4_boot_release {} {
    set _rc 0


    # RCC->M4RSTREL bit0: release the core out of reset-hold.
    if {[catch {mww $::N32H7_CM4_RELEASE 0x00000001} _e]} {
        echo "  ERROR: CM4 release write failed: $_e"
        set _rc 1
    }

    if {$_rc == 0} {
        sleep $::N32H7_CM4_SETTLE_MS
    }
    return $_rc
}

# Mirrors the DFP's DebugPortStart: M7 (AP0) first, then release the CM4
# through the M7 bus, and only then touch the CM4 core (AP2).
# N32H7xx_dual_autorelease = 0 instead skips the release and leaves the M4
# target unexamined until the M7 app brings the CM4 up.
set ::N32H7xx_dual_autorelease 1

proc _N32H7xx_dual_connect {} {
    global _M7TGT _M4TGT
    echo "N32H7xx dual connect: bring up M7 (AP0), then CM4 (AP2)..."

    # A just-released CM4 with no valid image yet can lock up; background
    # poll would fight the bring-up with "polling failed" noise.
    catch {poll off}
    set _err 0

    # wait out the boot window that a DAP_Connect nRESET toggle just restarted
    if {$::N32H7_EXAMINE_DELAY_MS > 0} {
        sleep $::N32H7_EXAMINE_DELAY_MS
    }

    # ---- 1. M7 (AP0): never held in reset, and its bus owns the CM4
    #         release register.
    if {[catch {$_M7TGT arp_examine} e]} {
        echo "  ERROR: M7 (AP0) examine failed: $e"
        catch {poll on}
        return 1
    }
    echo "  M7 examined OK."

    # ---- 2. Is the CM4 still held?  (release register = M7 bus side)
    _use_m7
    set _hold 0xFFFFFFFF
    catch {set _hold [mrw $::N32H7_CM4_RELEASE]}
    echo "  CM4 reset-hold register 0x58030174 = [format 0x%08X $_hold]"

    set _m4_ok 1
    if {$_hold == 0 || $_hold == 0xFFFFFFFF} {
        if {$::N32H7xx_dual_autorelease} {
            echo "  CM4 is held in reset -- releasing it."
            if {[_N32H7xx_cm4_boot_release]} {
                set _m4_ok 0
            }
        } else {
            echo "  CM4 is held in reset and N32H7xx_dual_autorelease = 0."
            echo "  Leaving it alone -- the M7 app releases it in main()."
            echo "  The M4 session connects once it has; re-attach then."
            set _m4_ok 0
        }
    }

    # ---- 3. M4 (AP2): only safe once the CM4 is out of reset-hold.
    if {$_m4_ok} {
        echo "N32H7xx dual connect: examining CM4 (AP2)..."
        if {[catch {$_M4TGT arp_examine} e]} {
            echo "  ERROR: CM4 (AP2) examine failed: $e"
            echo "         chip may still be starting up -- retry the attach,"
            echo "         or check that the M7 app has brought up the CM4 domain."
            set _err 1
        } else {
            echo "  CM4 examined OK."
            # Halt it: a freshly-released CM4 with no valid image yet would
            # otherwise run into a HardFault/lockup.
            catch {$_M4TGT arp_halt}
        }
    } else {
        set _err 1
    }

    catch {poll on}
    return $_err
}

# Re-runnable bring-up, for after anything that resets the whole chip:
#     (gdb) monitor N32H7xx_dual_reconnect
proc N32H7xx_dual_reconnect {} {
    set _saved [_dual_enter]
    echo "N32H7xx dual reconnect..."
    _use_m7
    # force a fresh examine: cached state is stale after a chip reset
    catch {$_M7TGT arp_examine}
    set _rc [_N32H7xx_dual_connect]
    if {$_rc == 0} {
        echo "  dual-core bring-up OK."
    } else {
        echo "  dual-core bring-up reported problems (see above)."
    }
    _dual_leave $_saved
}

# Manual CM4 release, for the N32H7xx_dual_autorelease = 0 workflow, then
# re-attach the M4 session:
#     (gdb) monitor N32H7xx_m4_release
proc N32H7xx_m4_release {} {
    global _M4TGT
    set _saved [_dual_enter]
    _use_m7
    if {[_N32H7xx_cm4_boot_release]} {
        echo "CM4 release failed (see above)."
        _dual_leave $_saved
        return
    }
    echo "CM4 released (0x58030174 = 1)."
    if {[catch {$_M4TGT arp_examine} e]} {
        echo "CM4 examine failed: $e"
        _dual_leave $_saved
        return
    }
    catch {$_M4TGT arp_halt}
    echo "CM4 examined + halted. Re-attach the M4 debug session."
    _dual_leave $_saved
}

# M4 GDB attach: re-establish the target, then LEAVE IT RUNNING (the M7
# enters debug parked at `main`, the M4 running -- parking the M4 is an
# explicit `monitor reset halt`).
# Needed because the M7 launch did a whole-chip reset: the M4 target is
# stale, and its first register read would be an AP2 access against a
# gated AP2 -- which wedges the CMSIS-DAP link.
proc N32H7xx_m4_gdb_attach {} {
    global _M7TGT _M4TGT
    set _saved [_dual_enter]

    if {[catch {$_M7TGT was_examined} _wex] == 0 && $_wex} {
        # the release bit is M7 bus side
        _use_m7
        if {[_N32H7xx_cm4_boot_release]} {
            echo "  note: CM4 start failed (see above) -- AP2 may stall."
        }
        _use_m4
        if {[catch {$_M4TGT arp_examine} e]} {
            echo "  note: CM4 re-examine failed ($e)"
        }
    } else {
        echo "  note: M7 not examined -- CM4 left as-is."
    }

    _dual_leave $_saved
}

# Recover the M4 target after the M7's whole-chip reset (SYSRESETREQ),
# which drops the CM4 back into reset-hold and leaves this M4 target
# stale -- any AP2 access then wedges the link unrecoverably.
# The M7 reset procs call this instead of telling the user: the debug
# launcher does not notify a chained child session that the chip was reset.
# Ends with the CM4 RUNNING, matching the attach path.
proc _N32H7xx_m4_recover {} {
    global _M7TGT _M4TGT
    set _saved [_dual_enter]

    _use_m7
    if {[catch {$_M7TGT was_examined} _wex] != 0 || !$_wex} {
        echo "  note: M7 not examined -- M4 target left stale."
        _dual_leave $_saved
        return 1
    }
    if {[_N32H7xx_cm4_boot_release]} {
        echo "  note: CM4 restart after the M7 reset failed (see above)."
        _dual_leave $_saved
        return 1
    }

    _use_m4
    if {[catch {$_M4TGT arp_examine} _e]} {
        echo "  note: CM4 re-examine after the M7 reset failed ($_e)"
        _dual_leave $_saved
        return 1
    }
    if {[catch {resume} _e]} {
        echo "  note: CM4 resume after the M7 reset failed ($_e)"
        _dual_leave $_saved
        return 1
    }

    echo "  CM4 target re-established and running."
    _dual_leave $_saved
    return 0
}

# Diagnostic: state of both cores.
proc N32H7xx_dual_status {} {
    set _saved [_dual_enter]
    echo "---- N32H7xx dual-core status ----"
    echo [capture "targets"]
    _use_m7
    set _hold 0xFFFFFFFF
    catch {set _hold [mrw $::N32H7_CM4_RELEASE]}
    echo [format "  CM4 reset-hold 0x58030174 = 0x%08X  (bit0 = 1 -> CM4 released)" $_hold]
    _dual_leave $_saved
}

# Wait for BOOT to release AP0. CSW is a DP-side (SWD) register, so reading it is safe while
# AP0 is disabled -- an AP0 memory access there latches the DP's STICKYERR for the session.
# Returns the wait in ms; errors on timeout instead of touching a gated AP.
proc _n32h7_wait_ap0 {timeout_ms tag} {
    set _w 0
    set _c 0
    set _why ""
    while {$_w < $timeout_ms} {
        set _e ""
        if {![catch {set _c [$::_CHIPNAME.dap apreg 0 0]} _e] && ($_c & 0x40) != 0} {
            if {$_w > 0} {
                echo "  $tag: AP0 was disabled, released after ${_w} ms (CSW=[format 0x%08X $_c])"
            }
            return $_w
        }
        if {$_e ne ""} { set _why " / AP read error: $_e" }
        sleep 10
        incr _w 10
    }
    error "$tag: AP0 still disabled after ${_w} ms (CSW=[format 0x%08X $_c]$_why) -- BOOT has not released it, refusing to touch AP0 memory; if this repeats, power-cycle the board"
}

# Reset, let boot run to the app entry, end halted. The target must be reachable on entry.
#   a. never RELEASE the core before the trap is armed -- a parked core then runs SystemInit
#      -> ConfigTcmSize() -> NVIC_SystemReset(), whose boot window latches STICKYERR.
#   b. never HALT a core this proc did not find halted -- C_HALT stops boot at the reset
#      vector, and freezing a running BOOT means AP0 is never released.
proc _n32h7_boot_reset {} {
    set _err [catch {
        # 0. preflight: a chip already inside a boot window would fault step 1 instead
        _n32h7_wait_ap0 4000 entry

        # 1. no vector catch -- stopping inside boot is what we must avoid
        set _demcr [mrw $::N32H7_DBG_DEMCR]
        mww $::N32H7_DBG_DEMCR [expr {$_demcr & ~0x1}]

        # 2. where boot will jump to
        set _vt 0x15000000
        if {[catch {set _vt [mrw $::N32H7_STORE_ADDR]} _e]} {
            echo "  note: M7_StoreAddr_cur read failed ($_e), using 0x15000000"
            set _vt 0x15000000
        }
        if {[expr {$_vt == 0 || $_vt == 0xFFFFFFFF}]} {
            set _vt 0x15000000
        }
        echo "  boot -> app vector table @ [format 0x%08X $_vt]"
        set _reset_h [mrw [expr {$_vt + 4}]]

        # 3. Trap the app Reset_Handler on the LAST comparator (OpenOCD hands them out from 0
        #    upward); saved with FP_CTRL so step 7 can undo it verbatim. Armed before the
        #    core is released (step 4) -- a comparator on the current PC re-fires on the
        #    re-fetch, so a core parked on the entry cannot execute it.

        set _fpb_comp $::N32H7_FPB_COMP0
        set _fpb_comp_saved 0
        set _fpb_ctrl 0x3
        if {[catch {set _fpb_ctrl [mrw $::N32H7_FPB_CTRL]} _e3]} {
            echo "  note: FP_CTRL read failed ($_e3), using FP_COMP0"
            set _fpb_ctrl 0x3
        } else {
            # NUM_CODE spans FP_CTRL[7:4] and [14:12] (ARMv7-M FPB)
            set _fpb_num [expr {(($_fpb_ctrl >> 8) & 0x70) | (($_fpb_ctrl >> 4) & 0xF)}]
            set _last [expr {$::N32H7_FPB_COMP0 + 4 * ($_fpb_num - 1)}]
            if {$_fpb_num >= 1 && $_fpb_num <= 8 &&
                ![catch {set _fpb_comp_saved [mrw $_last]} _e4]} {
                set _fpb_comp $_last
            } else {
                echo "  note: last FPB comparator unusable ($_fpb_num), using FP_COMP0"
                set _fpb_comp_saved 0
            }
        }
        mww $_fpb_comp [expr {($_reset_h & 0x1FFFFFFC) | 0x1}]
        mww $::N32H7_FPB_CTRL [expr {$_fpb_ctrl | 0x3}]

        # 4. release + reset back to back -- one transaction apart. C_HALT=0 is mandatory
        #    here (with it set boot never runs) but must not come any earlier: see (a).
        mww $::N32H7_DBG_DHCSR 0xA05F0001
        poll off
        if {[catch {mww $::N32H7_SCS_AIRCR 0x05FA0004} _e2]} {
            # Expected: the reset drops the SWD link mid-transfer, so the DAP answers JUNK
            # (measured "SWD ack not OK @ 3 JUNK"). Step 5 settles it.
            echo "  note: AIRCR write: $_e2 -- expected, reset drops the SWD link mid-transfer"
        }

        # 4b. BOOT holds AP0 disabled (CSW.DeviceEn) past that sleep -- the old HID firmware
        #     was only pushed beyond it by its JUNK on the AIRCR write. Touching AP0 first
        #     latches STICKYERR, so wait it out.
        _n32h7_wait_ap0 4000 post-reset

        # 5. the FPB match halted at the app entry; C_DEBUGEN|C_HALT clears a lockup
        #    from there being no valid image.
        mww $::N32H7_DBG_DHCSR 0xA05F0003

        # 6. S_RESET_ST clears on read
        set _dh [mrw $::N32H7_DBG_DHCSR]
        set _t0 [clock milliseconds]
        while {[expr {$_dh & 0x02000000}] && [expr {[clock milliseconds] - $_t0}] < 3000} {
            sleep 1
            set _dh [mrw $::N32H7_DBG_DHCSR]
        }

        # 7. Undo the trap verbatim; never clear FP_CTRL.ENABLE (OpenOCD caches it and
        #    that would kill every hardware breakpoint for the session).
        catch {mww $_fpb_comp $_fpb_comp_saved}
        mww $::N32H7_FPB_CTRL [expr {$_fpb_ctrl | 0x3}]
    } _msg]
    # Undo the trap even if it threw: a stale comparator halts the core on the next reset.
    if {[info exists _fpb_comp] && [info exists _fpb_comp_saved] && [info exists _fpb_ctrl]} {
        catch {mww $_fpb_comp $_fpb_comp_saved}
        catch {mww $::N32H7_FPB_CTRL [expr {$_fpb_ctrl | 0x3}]}
    }
    catch {poll on}
    if {$_err} {
        # Died half-way, most likely on a faulting AP access: disarm what it armed and
        # put the core back to running, so the next connect finds a chip that boots.
        catch {_n32h7_wipe_debug_domain reset-failed run}
        error $_msg
    }
}

proc N32H7xx_m7_reset_halt {} {
    set _saved [_dual_enter]
    echo "N32H7xx M7 boot-aware reset (halt at app entry) -- WHOLE CHIP resets"
    set _err [catch {_n32h7_boot_reset} _msg]
    if {$_err} {
        echo "  M7 boot-aware reset failed: $_msg"
    }
    if {!$_err} {
        # re-sync OpenOCD's idea of the core state (the raw reset bypassed it).
        # No bare `poll` here: that would re-enable polling while the M4 target
        # is still stale and wedged.
        _use_m7
        if {[catch {halt} _m]} {
            echo "  note: halt after reset: $_m"
        }
        echo "  M7 halted at app entry."
    }
    # the CM4 was reset with it: fix it up BEFORE polling touches it again
    _N32H7xx_m4_recover
    catch {poll on}
    _dual_leave $_saved
    if {$_err} { error $_msg }
}

proc N32H7xx_m7_reset_run {} {
    set _saved [_dual_enter]
    echo "N32H7xx M7 boot-aware reset (run to app) -- WHOLE CHIP resets"
    set _err [catch {_n32h7_boot_reset} _msg]
    if {$_err} {
        echo "  M7 boot-aware reset failed: $_msg"
    }
    if {!$_err} {
        # no bare `poll` here -- it would poll the still-stale M4 target
        _use_m7
        if {[catch {halt} _m]} {
            echo "  note: halt after reset: $_m"
        }
        resume
        echo "  M7 running."
    }
    # the CM4 was reset with it: fix it up BEFORE polling touches it again
    _N32H7xx_m4_recover
    catch {poll on}
    _dual_leave $_saved
    if {$_err} { error $_msg }
}

# Core-local VECTRESET -- the M4's own system reset would drop the WHOLE
# chip, so only VECTRESET is used.  VC_CORERESET makes the core stop at
# the M4 reset vector, before any app code.  The M7 is untouched.
proc _N32H7xx_m4_vectreset {run_mode} {
    global _M7TGT

    # 1. Reach the M4 through the M7 bus FIRST.  Every AP2 access stalls
    #    while the CM4 is held in reset-hold, and an M7 whole-chip reset
    #    (the dual launch flow's `monitor reset halt`) puts it right back
    #    there -- and this proc runs next.  The M7 is always examined here.
    if {[catch {$_M7TGT was_examined} _wex] == 0 && $_wex} {
        _use_m7
        if {[_N32H7xx_cm4_boot_release]} {
            echo "  note: CM4 start failed (see above)"
        }
        # cached M4 state does not survive a whole-chip reset; re-examining
        # an already-examined target is safe
        catch {$_M4TGT arp_examine}
    } else {
        echo "  note: M7 not examined -- M4 release register left as-is."
    }

    # 2. Halt M4
    _use_m4
    if {[catch {mww $::N32H7_DBG_DHCSR 0xA05F0003} e]} {
        echo "  note: M4 halt before VECTRESET: $e"
    }

    # 3. Vector-catch VECTRESET (core-only reset, ends halted at M4 vector)
    set _demcr 0
    catch {set _demcr [mrw $::N32H7_DBG_DEMCR]}
    catch {mww $::N32H7_DBG_DEMCR [expr {$_demcr | 0x1}]}   ;# VC_CORERESET on

    poll off
    if {[catch {mww $::N32H7_SCS_AIRCR 0x05FA0001} e]} {    ;# VECTRESET
        echo "  note: VECTRESET write suppressed ($e)"
    }
    # wait reset to complete (S_RESET_ST clears on read), 3 s timeout
    set _t0 [clock milliseconds]
    set _dh 0
    catch {set _dh [mrw $::N32H7_DBG_DHCSR]}
    while {[expr {$_dh & 0x02000000}] && [expr {[clock milliseconds] - $_t0}] < 3000} {
        sleep 1
        set _dh 0
        catch {set _dh [mrw $::N32H7_DBG_DHCSR]}
    }
    catch {poll on}

    # 4. Vector catch off, then settle into a clean debug-halted state.
    #    (0xA05F0003 also clears S_LOCKUP when there is no valid M4 image.)
    set _demcr 0
    catch {set _demcr [mrw $::N32H7_DBG_DEMCR]}
    catch {mww $::N32H7_DBG_DEMCR [expr {$_demcr & ~0x1}]}
    catch {mww $::N32H7_DBG_DHCSR 0xA05F0003}

    # 5. Re-sync OpenOCD's view of the M4 core (raw writes bypassed it)
    _use_m4
    if {[catch {halt} _m]} {
        echo "  note: halt after VECTRESET: $_m"
        poll
    }
    echo "  M4 core-local reset done, core halted."

    if {$run_mode eq "run"} {
        if {[catch {resume} _m]} {
            echo "  note: resume after reset: $_m"
        }
        echo "  M4 running."
    }
}

proc N32H7xx_m4_reset_halt {} {
    set _saved [_dual_enter]
    echo "N32H7xx M4 reset halt (core-local VECTRESET, M7 untouched)"
    _N32H7xx_m4_vectreset halt
    _dual_leave $_saved
}

proc N32H7xx_m4_reset_run {} {
    set _saved [_dual_enter]
    echo "N32H7xx M4 reset run (core-local VECTRESET, M7 untouched)"
    _N32H7xx_m4_vectreset run
    echo "  done."
    _dual_leave $_saved
}

# --- Route `reset` through the per-core flows ---
# Two GDB clients share one OpenOCD and `reset` is a single global command,
# so the override dispatches on the calling connection's core (see the
# _dual_current_target note for why that is reliable).
# A plain `proc reset` would not survive -- OpenOCD re-registers the stock
# one during `init` -- so wrap `init` instead: run the real init (its
# `reset` is registered by then), rename it aside, install the override.
if {[info commands init] eq "init"} {
    rename init _N32H7xx_dual_oocd_init
} else {
    error "internal: expected OpenOCD 'init' command to exist"
}

proc init {args} {
    # stock init: adapter up, both gdb servers started.  Both targets are
    # defer-examine, so this does NOT touch the (possibly held) CM4 -- that
    # would stall on AP2.
    eval _N32H7xx_dual_oocd_init $args

    # dual-core bring-up: M7 (AP0), then CM4 (AP2).  Before any reset/halt.
    if {[catch {_N32H7xx_dual_connect} _rc]} {
        echo "N32H7xx dual connect raised an error: $_rc"
    }

    if {![info exists ::_N32H7xx_dual_override_installed]} {
        set ::_N32H7xx_dual_override_installed 1
        if {[info commands reset] eq "reset"} {
            rename reset _N32H7xx_dual_oocd_reset
        }
        proc reset {args} {
            global _M4SUFFIX
            # resolve the calling connection's core FIRST, before any proc
            # below gets a chance to switch it
            set _cur [_dual_current_target]
            set _is_m4 [string equal [lindex [split $_cur .] end] $_M4SUFFIX]

            switch -- [lindex $args 0] {
                ""      { if {$_is_m4} { N32H7xx_m4_reset_run }  else { N32H7xx_m7_reset_run } }
                "run"   { if {$_is_m4} { N32H7xx_m4_reset_run }  else { N32H7xx_m7_reset_run } }
                "halt"  { if {$_is_m4} { N32H7xx_m4_reset_halt } else { N32H7xx_m7_reset_halt } }
                "init"  { if {$_is_m4} { N32H7xx_m4_reset_halt } else { N32H7xx_m7_reset_halt } }
                default {
                    if {[llength [info commands _N32H7xx_dual_oocd_reset]] > 0} {
                        eval _N32H7xx_dual_oocd_reset $args
                    } else {
                        error "reset: unsupported argument(s): $args"
                    }
                }
            }
        }
        echo "N32H7xx dual: per-core reset override installed (M7 / M4 dispatch)."
    }
}


