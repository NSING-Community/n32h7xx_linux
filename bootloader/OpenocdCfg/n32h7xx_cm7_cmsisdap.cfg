# OpenOCD config: n32h7xx (CMSIS-DAP).
# flash_op.bin is loaded into SRAM and driven via BKPT-based function calls.
#
# Usage:
#   Download: openocd -f xxxx_cmsisdap.cfg -c "init" -c "reset halt" -c "flash_program_bin <file.bin>" -c "reset run" -c "shutdown"
#   Debug:    openocd -f xxxx_cmsisdap.cfg
#   Erase:    openocd -f xxxx_cmsisdap.cfg -c "init" -c "reset init" -c "flash_mass_erase" -c "reset run" -c "shutdown"
#
# reset halt/run/init are redefined at the end of this file (boot-aware flow):
# while the boot ROM runs, any system-memory access wedges the CMSIS-DAP link.

adapter driver cmsis-dap

# NSLink 0x19F5/0x3106; stock CMSIS-DAP 0xC251/0xF001; DAPLink 0x0D28/0x0204
#
# The defaults below are the NSLink probe this board ships with.  To use any
# other CMSIS-DAP, set the pair before this file is sourced, e.g.
#   openocd -c "set ADAPTER_VID 0xC251" -c "set ADAPTER_PID 0xF001" -f <this file>
if {![info exists ADAPTER_VID]} { set ADAPTER_VID 0x19F5 }
if {![info exists ADAPTER_PID]} { set ADAPTER_PID 0x3106 }
if {[llength [info commands cmsis_dap_vid_pid]] > 0} {
    cmsis_dap_vid_pid $::ADAPTER_VID $::ADAPTER_PID
} else {
    adapter usb vid_pid $::ADAPTER_VID $::ADAPTER_PID
}

transport select swd
source [find mem_helper.tcl]        ;# mrw/mww/mdw

adapter speed 1000
## NTFx CODE START ##

# --- Target: N32H787XIB7 (cortex_m7) ---
set _CHIPNAME n32h7xx

# ============================================================
# Flash geometry from FlashDev.c
#   Flash start:  0x15000000
#   Flash size:  0x1E0000
#   Sector size: 0x1000 
# ============================================================
set FLASH_START 0x15000000   
set FLASH_SIZE  0x1E0000
set FLASH_PAGE  0x1000  

# ============================================================
# FlashOS SRAM Algorithm 
#
# Loaded into system memory at 0x24000000.
#
# Function addresses:
#   Init        0x24000041
#   UnInit      0x24000071
#   EraseChip   0x24000091
#   EraseSector 0x240000E1
#   ProgramPage 0x24000139
#   Verify      0x24000199
# ============================================================
# Relative to the working directory OpenOCD was started in, so the default only
# resolves when openocd runs from bootloader/.  Pass an absolute path instead
# when starting it from anywhere else (a -c after -f still wins):
#   openocd -f OpenocdCfg/n32h7xx_cm7_cmsisdap.cfg \
#       -c "set FLASH_ALGO_BIN /abs/path/to/flash_op.bin"
if {![info exists FLASH_ALGO_BIN]} {
    set FLASH_ALGO_BIN "OpenocdCfg/cm7_flash_op/flash_op.bin"
}
set FLASH_ALGO_BASE   0x24000000

set FOS_Init          0x24000041
set FOS_UnInit        0x24000071
set FOS_EraseChip     0x24000091
set FOS_EraseSector   0x240000E1
set FOS_ProgramPage   0x24000139
set FOS_Verify       0x24000199

# SRAM working area layout:
#     0x24000000- 0x24000210 : flash_op algorithm
#     0x24000211 - 0x24000FDF : unused margin
#     0x24000FE0             : temp stack top (grows downward)
#     0x24000FF0             : BKPT instruction for function return
#     0x24001000 - 0x24005000 : image data buffer (up to FOS_BUF_SIZE per run)
set FOS_BUF_ADDR      0x24001000
set FOS_BUF_SIZE      0x4000  
set FOS_STACK_TOP     0x24000FE0
set FOS_BKPT_ADDR     0x24000FF0

## NTFx CODE END ##
set _ENDIAN little

# Standard Cortex_M7 IDCODE: 0x5BA02477. Remove -expected-id if chip uses different ID
swd newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x5BA02477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap

reset_config srst_nogate
if {![using_hla]} {
    cortex_m reset_config sysresetreq
}


# Delay examination so a connected nRESET wire cannot break `init`: NSLink toggles
# its nRESET pin during DAP_Connect, which pin-resets the target, and the examination
# that follows lands in the ~100 ms boot window where AHB-AP accesses fault
# ("Failed to read memory at 0xe000ed00"). Measured: 0-80 ms fails, >=120 ms passes.
# This delay does not recover a target already wedged in application code. For that,
# use tools/openocd_tcl.py recover-halt, which pulses DAP_ResetTarget first.
# 0 = off (4-wire SWD, no nRESET wire).
set N32H7_EXAMINE_DELAY_MS 200

if {$::N32H7_EXAMINE_DELAY_MS > 0} {
    $_TARGETNAME configure -event examine-start "sleep $::N32H7_EXAMINE_DELAY_MS"
}

# Set only by a successful examine, so it doubles as the "target came up" flag.
$_TARGETNAME configure -event examine-end { set ::_n32h7_examined 1 }

$_TARGETNAME configure -event gdb-attach {
    halt 1000
}
# End-of-session hygiene, fired from gdb_connection_closed() (not GDB's `D`), and
# cortex-debug waits only 100 ms, so keep it short. See the wipe section.
$_TARGETNAME configure -event gdb-detach {
    catch {_n32h7_session_end detach}
    # gdb_detach() does not resume -- hand the core back running.
    catch {resume}
}


proc _safe_load_image {file addr} {
    if {[catch {load_image $file $addr} msg]} {
        puts "  load_image Fail: $msg"
        puts "  Please disconnect and reconnect the debugger, then try again,"
        error $msg
    }
}

proc flashos_load {} {
    if {![file exists $::FLASH_ALGO_BIN]} {
        error "Flash algorithm binary not found: $::FLASH_ALGO_BIN"
    }
    puts "Loading $::FLASH_ALGO_BIN to [format 0x%08X $::FLASH_ALGO_BASE]..."
    _safe_load_image $::FLASH_ALGO_BIN $::FLASH_ALGO_BASE

    set first_word [mrw $::FLASH_ALGO_BASE]
    puts "Algorithm @ [format 0x%08X $::FLASH_ALGO_BASE]: [format 0x%08X $first_word]"
    if {$first_word == 0 || $first_word == 0xFFFFFFFF} {
        error "Flash algorithm not loaded correctly: first word = [format 0x%08X $first_word]"
    }
}

# OpenOCD >= 0.12 lowercases register names ("xpsr"), older versions use
# "xPSR". Probed once (target must be halted) and cached.
set ::XPSR_REG ""
proc _xpsr_regname {} {
    if {$::XPSR_REG eq ""} {
        if {![catch {reg xPSR}]} {
            set ::XPSR_REG xPSR
        } else {
            set ::XPSR_REG xpsr
        }
    }
    return $::XPSR_REG
}

# Call a FlashOS function in SRAM: arm the BKPT, set SP/args/LR/PC, resume,
# and read the result from R0 once the function lands on the BKPT.
# All flash functions return 0 = OK, 1 = Failed.
#
# BKPT and LR must be re-armed before EVERY call: the ROM-calling wrappers
# return to the *saved* entry LR, so a stale LR (ROM leftovers, or
# 0xFFFFFFFF / EXC_RETURN right after reset) HardFaults.
proc flashos_call {func_addr args} {
    mww $::FOS_BKPT_ADDR 0x0000BE00
    reg sp $::FOS_STACK_TOP

    # ARM EABI: first 4 args in R0-R3, the rest zeroed
    set regs {r0 r1 r2 r3}
    set i 0
    foreach val $args {
        reg [lindex $regs $i] $val
        incr i
        if {$i >= 4} { break }
    }
    for {} {$i < 4} {incr i} {
        reg [lindex $regs $i] 0
    }

    reg lr [expr {$::FOS_BKPT_ADDR | 1}]

    # T=1 is mandatory: "reset halt" leaves the core with xPSR.T=0, and the
    # first fetch would fault (INVSTATE) before the function runs.
    reg [_xpsr_regname] 0x01000000

    reg pc $func_addr
    resume

    wait_halt 15000                       ;# generous: covers flash erase

    set ret_raw [reg r0]
    set ret 0
    if {![regexp {(0x[0-9a-fA-F]+)} $ret_raw -> ret_hex]} {
        set ret_hex $ret_raw
    }
    set ret [expr {$ret_hex}]
    return $ret
}

proc flashos_init {} {
    set ret [flashos_call $::FOS_Init 0x08000000 0 1]
    if {$ret != 0} {
        puts "FlashOS Init failed with return code $ret"
        error "FlashOS Init returned $ret"
    }
    puts "FlashOS Init OK."
}

proc flashos_uninit {} {
    flashos_call $::FOS_UnInit 0
    puts "FlashOS UnInit OK."
}

proc flashos_erase_sector {addr} {
    set ret [flashos_call $::FOS_EraseSector $addr]
    if {$ret != 0} {
        puts "FlashOS EraseSector @ [format 0x%08X $addr] failed with return code $ret"
        error "FlashOS EraseSector failed"
    }
}

proc flash_mass_erase {} {
    set ret [flashos_call $::FOS_EraseChip]
    if {$ret != 0} {
        puts "FlashOS EraseChip failed with return code $ret"
        error "FlashOS EraseChip returned $ret"
    }
    puts "Mass erase complete."
}

proc _n32h7_reset_init_handler {} {
    flashos_load
    flashos_init
    echo "N32H7 initialized (flash algorithm loaded, FlashOS Init called)"
}

$_TARGETNAME configure -event reset-init {
    _n32h7_reset_init_handler
}

# Stage one chunk in SRAM via a temp file: a bulk load_image beats a
# word-by-word mww loop.
proc _sram_load_chunk {bin_file offset size dst_addr} {
    # Binary offsets are bytes. Jim string range indexes characters and silently
    # skips bytes in ARM machine code after the first chunk.
    set tmp "_chunk_tmp.bin"
    set src [open $bin_file rb]
    fconfigure $src -translation binary
    seek $src $offset start
    set chunk [read $src $size]
    close $src
    set fh [open $tmp wb]
    fconfigure $fh -translation binary
    puts -nonewline $fh $chunk
    close $fh
    if {[file size $tmp] != $size} {
        file delete $tmp
        error "Short binary chunk: offset=$offset expected=$size"
    }
    _safe_load_image $tmp $dst_addr
    file delete $tmp
}

proc _host_verify_image {bin_file start_addr len} {
    set readback "${bin_file}.readback-[clock milliseconds].bin"
    dump_image $readback $start_addr $len
    set f [open $bin_file rb]
    fconfigure $f -translation binary
    set expected [read $f]
    close $f
    set f [open $readback rb]
    fconfigure $f -translation binary
    set actual [read $f]
    close $f
    binary scan $expected c* expected_bytes
    binary scan $actual c* actual_bytes
    if {[llength $expected_bytes] != $len || [llength $actual_bytes] != $len ||
        $expected_bytes ne $actual_bytes} {
        error "Host image verification FAILED; readback kept at $readback"
    }
    puts "Host image verification PASS: $len bytes; readback $readback"
}

# Chunked programmer: FOS_BUF_SIZE per call, verify right after each program
# while the buffer still holds the chunk.
proc flash_program_bin {bin_file {start_addr 0x15000000}} {
    set _t0 [clock milliseconds]
    set page_size $::FLASH_PAGE
    set chunk_size $::FOS_BUF_SIZE
    puts "=========================================="
    puts "File: $bin_file"

    if {![file exists $bin_file]} {
        error "File not found: $bin_file"
    }
    if {[expr {$start_addr & ($page_size - 1)}] != 0} {
        puts "start_addr must be $page_size-byte aligned, got [format 0x%08X $start_addr]"
        return
    }
    set len [file size $bin_file]
    if {$len == 0} {
        puts "File is empty: $bin_file"
        return
    }

    puts "Binary size: $len bytes"
    puts "Start address: [format 0x%08X $start_addr]"
    puts "Sector size: [format 0x%X $::FLASH_PAGE]"
    puts "=========================================="

    set end_addr [expr {$start_addr + $len}]
    if {$end_addr > [expr {$::FLASH_START + $::FLASH_SIZE}]} {
        puts "Binary too large: $len bytes (flash max $::FLASH_SIZE)"
        return
    }

    flashos_load
    flashos_init

    # ---- Phase 1: erase every affected sector ----
    puts "Erasing all affected sectors..."
    set sector_count 0
    for {set pa $start_addr} {$pa < $end_addr} {set pa [expr {$pa + $page_size}]} {
        puts "  Erasing sector @ [format 0x%08X $pa]"
        flashos_erase_sector $pa
        incr sector_count
    }
    puts "[expr {$sector_count}] sector(s) erased."

    # ---- Phase 2: program + verify ----
    puts "Programming and Verify..."
    for {set pa $start_addr} {$pa < $end_addr} {set pa [expr {$pa + $chunk_size}]} {
        set chunk_start [expr {$pa > $start_addr ? $pa : $start_addr}]
        set next_pa [expr {$pa + $chunk_size}]
        set chunk_end [expr {$next_pa < $end_addr ? $next_pa : $end_addr}]
        set chunk_sz [expr {$chunk_end - $chunk_start}]

        if {$chunk_sz <= 0} { continue }

        set src_offset [expr {$chunk_start - $start_addr}]
        _sram_load_chunk $bin_file $src_offset $chunk_sz $::FOS_BUF_ADDR

        set ret [flashos_call $::FOS_ProgramPage $chunk_start $chunk_sz $::FOS_BUF_ADDR]
        if {$ret != 0} {
            puts "ProgramPage @ [format 0x%08X $chunk_start] returned $ret"
            error "ProgramPage failed"
            return
        }

        set ret [flashos_call $::FOS_Verify $chunk_start $chunk_sz $::FOS_BUF_ADDR]
        if {$ret != 0} {
            puts "Verify failed @ [format 0x%08X $chunk_start] (returned $ret)"
            error "Verify failed"
            return
        }

        set progress [expr {($chunk_end - $start_addr) * 100 / $len}]
        puts "  $progress% (program+verify @ [format 0x%08X $chunk_start])"
    }

    flashos_uninit
    _host_verify_image $bin_file $start_addr $len

    set _el [expr {[clock milliseconds] - $_t0}]
    puts "Flash programming complete in [format %.1f [expr {$_el / 1000.0}]] s."
}

# Boot-first reset, mirroring the Keil DFP pack ResetSystem: while boot runs, ANY AHB/AP
# access wedges the whole link (only the debug PPB 0xE000xxxx is reachable), so a stock
# `reset halt` deadlocks. Vector catch off, run, FPB-trap the app Reset_Handler,
# SYSRESETREQ, halt, restore.

set N32H7_STORE_ADDR  0x5110511c       ;# MMU M7_StoreAddr_cur = app vector table base
set N32H7_BOOT_WAIT_MS 500             ;# ms for boot to reach the app (pack uses 500)

set N32H7_DBG_DEMCR  0xE000EDFC
set N32H7_DBG_DHCSR  0xE000EDF0
set N32H7_DBG_CFSR   0xE000ED28       ;# configurable fault status, all flags sticky W1C
set N32H7_DBG_HFSR   0xE000ED2C       ;# hard fault status, FORCED(30) is W1C
set N32H7_STARTUP_WINDOW_MS 200        ;# window for the post-program startup fault (below)
set N32H7_SCS_AIRCR  0xE000ED0C
set N32H7_FPB_CTRL   0xE0002000
set N32H7_FPB_COMP0  0xE0002008
set N32H7_DWT_CTRL   0xE0001000
set N32H7_DWT_COMP0  0xE0001020
set N32H7_DWT_FUNC0  0xE0001028

# ---------------------------------------------------------------------------
# Debug-domain hygiene: never leave a halt request behind.
#
# DHCSR (C_DEBUGEN/C_HALT), DEMCR and the FPB/DWT comparators survive nRESET and
# SYSRESETREQ -- only a power-on reset clears them. Halt sources: a latent VC_CORERESET
# (how `reset halt` works, so an aborted or killed session leaves it armed), C_HALT, and a
# leftover FPB/DWT comparator; a core stopped inside boot leaves the AHB-AP down, so later
# accesses fault. NSLink's nRESET pulse in DAP_Connect turns a latent arm into a halt
# before any Tcl runs -- also why removing the nRESET wire "fixes" it.
# ---------------------------------------------------------------------------

# Print what is about to be wiped: the last moment the leftovers are readable.
proc _n32h7_dump_debug_domain {tag} {
    set _s ""
    foreach {_n _a} [list DHCSR $::N32H7_DBG_DHCSR DEMCR $::N32H7_DBG_DEMCR \
                          FPB_CTRL $::N32H7_FPB_CTRL] {
        if {[catch {set _v [mrw $_a]}]} {
            append _s " $_n=?"
        } else {
            append _s [format " $_n=%08X" $_v]
        }
    }
    # PC only in Debug state: on a running core `reg pc` prints a spurious error.
    set _dh 0
    catch {set _dh [mrw $::N32H7_DBG_DHCSR]}
    if {($_dh & 0x20000)} {
        # `reg` returns a LIST, not a number -- take its last element, or format() throws.
        set _pc ""
        catch {set _pc [lindex [reg pc] end]}
        if {[regexp {^(0x[0-9a-fA-F]+|[0-9]+)$} $_pc]} {
            append _s [format " PC=%08X" $_pc]
        }
    }
    echo "N32H7: debug domain before cleanup ($tag):$_s"
    # Only comparators that can stop the core -- FPB while ENABLE is set, DWT when
    # FUNCTION[3:0] != 0 -- so a clean session stays quiet.
    set _nz {}
    catch {
        set _ctrl [mrw $::N32H7_FPB_CTRL]
        set _num [expr {(($_ctrl >> 8) & 0x70) | (($_ctrl >> 4) & 0xF)}]
        if {($_ctrl & 0x1) && $_num >= 1 && $_num <= 8} {
            for {set _i 0} {$_i < $_num} {incr _i} {
                set _c [mrw [expr {$::N32H7_FPB_COMP0 + 4 * $_i}]]
                if {$_c != 0} { lappend _nz [format "FPB%d=%08X" $_i $_c] }
            }
        }
        set _nw [expr {([mrw $::N32H7_DWT_CTRL] >> 28) & 0xF}]
        for {set _i 0} {$_i < $_nw} {incr _i} {
            set _f [mrw [expr {$::N32H7_DWT_FUNC0 + 0x10 * $_i}]]
            if {($_f & 0xF) != 0} {
                set _c [mrw [expr {$::N32H7_DWT_COMP0 + 0x10 * $_i}]]
                lappend _nz [format "DWT%d=FUNC%08X/COMP%08X" $_i $_f $_c]
            }
        }
    }
    if {[llength $_nz]} {
        echo "N32H7: comparators left ARMED by an earlier session ($tag): [join $_nz { }]"
    } else {
        echo "N32H7: no comparator left armed ($tag)."
    }
}

# Disarm every halt request on the current target; returns 0 on success.
#   run   -> DHCSR = 0xA05F0001 (keep control, core running)
#   end   -> DHCSR = 0xA05F0000 (gate off; also releases a halted core)
#   traps -> DHCSR untouched (the halt state stays OpenOCD's)
proc _n32h7_wipe_debug_domain {tag {mode run}} {
    set _why {}
    if {$mode ne "traps"} {
        set _dhcsr [expr {$mode eq "end" ? 0xA05F0000 : 0xA05F0001}]
        if {[catch {mww $::N32H7_DBG_DHCSR $_dhcsr} _e]} {
            lappend _why "DHCSR:$_e"
        }
    }
    # Mask 0xFFF clears every vector catch (all of them stop the core inside boot);
    # MON_EN/TRCENA are left alone.
    if {[catch {
        set _demcr [mrw $::N32H7_DBG_DEMCR]
        mww $::N32H7_DBG_DEMCR [expr {$_demcr & ~0xFFF}]
    } _e]} {
        lappend _why "DEMCR:$_e"
    }
    # Keep FP_CTRL.ENABLE: OpenOCD's cache means clearing it here kills every hardware
    # breakpoint for the rest of the session.
    if {[catch {
        set _ctrl [mrw $::N32H7_FPB_CTRL]
        # NUM_CODE spans FP_CTRL[7:4] and [14:12] (ARMv7-M FPB)
        set _num [expr {(($_ctrl >> 8) & 0x70) | (($_ctrl >> 4) & 0xF)}]
        if {$_num < 1 || $_num > 8} { set _num 6 }
        for {set _i 0} {$_i < $_num} {incr _i} {
            mww [expr {$::N32H7_FPB_COMP0 + 4 * $_i}] 0
        }
        mww $::N32H7_FPB_CTRL [expr {$_ctrl | 0x3}]
    } _e]} {
        lappend _why "FPB:$_e"
    }
    # Watchpoints: liveWatch arms these, same POR-only domain as the FPB.
    # DWT_CTRL[31:28] = NUMCOMP.
    if {[catch {
        set _numwp 4                       ;# Cortex-M7 implements 4 watchpoints
        if {![catch {set _dwctrl [mrw $::N32H7_DWT_CTRL]}]} {
            set _numwp [expr {($_dwctrl >> 28) & 0xF}]
        }
        for {set _i 0} {$_i < $_numwp} {incr _i} {
            # FUNCTION=0 disables the comparator; COMP is zeroed for tidiness
            mww [expr {$::N32H7_DWT_FUNC0 + 0x10 * $_i}] 0
            mww [expr {$::N32H7_DWT_COMP0 + 0x10 * $_i}] 0
        }
    } _e]} {
        lappend _why "DWT:$_e"
    }
    if {[llength $_why]} {
        echo "  note: debug-domain wipe incomplete ($tag): $_why"
        return 1
    }
    return 0
}

# Disarm the traps, leave DHCSR alone -- a comparator from a killed session must not
# bite on the next reset.
proc _n32h7_clear_traps {tag} {
    return [_n32h7_wipe_debug_domain $tag traps]
}

# A core stopped on one of our own BKPTs cannot simply be released: with debugging off a
# BKPT is an unexpected exception, so the release runs it and double-faults into lockup --
# the cleanup wedging the core in the aborted-flash_program_bin case it exists for. Park it
# on a "b ." in SRAM first; only a halted core inside the algorithm's window is touched.
# Measured parked: DHCSR = 0x01010000, HFSR/CFSR 0 for 800 ms; re-pointing at the app entry
# faults instead (CFSR 0x100, HFSR 0xC0000000). Caveat: an interrupt while parked vectors
# through VTOR into flash and faults; the state is transient.
proc _n32h7_release_safe {} {
    if {[catch {set _dh [mrw $::N32H7_DBG_DHCSR]}]} { return }
    if {!($_dh & 0x2)} { return }                    ;# C_HALT: only a stopped core
    # `reg` returns a LIST: a string compare here silently skips every core (measured).
    set _pc ""
    catch {set _pc [lindex [reg pc] end]}
    if {![regexp {^(0x[0-9a-fA-F]+|[0-9]+)$} $_pc]} { return }
    set _lo $::FLASH_ALGO_BASE
    set _hi [expr {$::FLASH_ALGO_BASE + 0x5000}]     ;# algo + FOS_BUF, see the map above
    if {$_pc < $_lo || $_pc >= $_hi} { return }
    # Point it at a "b ." so the release spins in SRAM; the RAM algorithm is reloaded
    # by every session that needs it.
    catch {mww [expr {$_pc & 0xFFFFFFFC}] 0xBF00E7FE}
    catch {reg pc [expr {($_pc & 0xFFFFFFFC) | 0x1}]}
    echo "  note: core was halted in the flash algorithm -- parked in a spin loop before release"
}

# End-of-session cleanup: evidence, then a safe release, then disarm everything.
proc _n32h7_session_end {tag} {
    catch {_n32h7_dump_debug_domain $tag}
    catch {_n32h7_release_safe}
    return [_n32h7_wipe_debug_domain $tag end]
}

# Runs on every shutdown -- the `-c "shutdown"` ending each Makefile flow, CTRL-C, any
# graceful exit -- covering the aborted download, where `reset run` never comes.
proc _run_pre_shutdown_commands {} {
    catch {_n32h7_session_end pre-shutdown}
}

# Wait for BOOT to release AP0. CSW is a DP-side (SWD) register, so reading it is safe while
# AP0 is disabled -- an AP0 memory access there latches the DP's STICKYERR for the session.
# Returns the wait in ms; errors on timeout instead of touching a gated AP.
proc _n32h7_wait_ap0 {timeout_ms tag} {
    set _w 0
    set _c 0
    set _why ""
    while {$_w < $timeout_ms} {
        set _e ""
        if {![catch {set _c [$::_CHIPNAME.dap apreg 0 0]} _e] && ($_c & 0x40) != 0} {
            if {$_w > 0} {
                echo "  $tag: AP0 was disabled, released after ${_w} ms (CSW=[format 0x%08X $_c])"
            }
            return $_w
        }
        if {$_e ne ""} { set _why " / AP read error: $_e" }
        sleep 10
        incr _w 10
    }
    error "$tag: AP0 still disabled after ${_w} ms (CSW=[format 0x%08X $_c]$_why) -- BOOT has not released it, refusing to touch AP0 memory; if this repeats, power-cycle the board"
}

# Reset, let boot run to the app entry, end halted. The target must be reachable on entry.
#   a. never RELEASE the core before the trap is armed -- a parked core then runs SystemInit
#      -> ConfigTcmSize() -> NVIC_SystemReset(), whose boot window latches STICKYERR.
#   b. never HALT a core this proc did not find halted -- C_HALT stops boot at the reset
#      vector, and freezing a running BOOT means AP0 is never released.
proc _n32h7_boot_reset {} {
    set _err [catch {
        # Clear DP SELECT (AP bank + APBANKSEL) before resetting.  nRESET does not
        # clear it, and a stale value makes the boot ROM leave AP0 disabled, which
        # otherwise forces a full power cycle.  A DP register write is safe while
        # AP0 is disabled.  Matches the vendor reference "dap dpreg 8 0" step.
        catch {$::_CHIPNAME.dap dpreg 8 0}

        # 0. preflight: a chip already inside a boot window would fault step 1 instead
        _n32h7_wait_ap0 4000 entry

        # 1. no vector catch -- stopping inside boot is what we must avoid
        set _demcr [mrw $::N32H7_DBG_DEMCR]
        mww $::N32H7_DBG_DEMCR [expr {$_demcr & ~0x1}]

        # 2. where boot will jump to
        set _vt 0x15000000
        if {[catch {set _vt [mrw $::N32H7_STORE_ADDR]} _e]} {
            echo "  note: M7_StoreAddr_cur read failed ($_e), using 0x15000000"
            set _vt 0x15000000
        }
        if {[expr {$_vt == 0 || $_vt == 0xFFFFFFFF}]} {
            set _vt 0x15000000
        }
        echo "  boot -> app vector table @ [format 0x%08X $_vt]"
        set _reset_h [mrw [expr {$_vt + 4}]]

        # 3. Trap the app Reset_Handler on the LAST comparator (OpenOCD hands them out from 0
        #    upward); saved with FP_CTRL so step 7 can undo it verbatim. Armed before the
        #    core is released (step 4) -- a comparator on the current PC re-fires on the
        #    re-fetch, so a core parked on the entry cannot execute it.

        set _fpb_comp $::N32H7_FPB_COMP0
        set _fpb_comp_saved 0
        set _fpb_ctrl 0x3
        if {[catch {set _fpb_ctrl [mrw $::N32H7_FPB_CTRL]} _e3]} {
            echo "  note: FP_CTRL read failed ($_e3), using FP_COMP0"
            set _fpb_ctrl 0x3
        } else {
            # NUM_CODE spans FP_CTRL[7:4] and [14:12] (ARMv7-M FPB)
            set _fpb_num [expr {(($_fpb_ctrl >> 8) & 0x70) | (($_fpb_ctrl >> 4) & 0xF)}]
            set _last [expr {$::N32H7_FPB_COMP0 + 4 * ($_fpb_num - 1)}]
            if {$_fpb_num >= 1 && $_fpb_num <= 8 &&
                ![catch {set _fpb_comp_saved [mrw $_last]} _e4]} {
                set _fpb_comp $_last
            } else {
                echo "  note: last FPB comparator unusable ($_fpb_num), using FP_COMP0"
                set _fpb_comp_saved 0
            }
        }
        mww $_fpb_comp [expr {($_reset_h & 0x1FFFFFFC) | 0x1}]
        mww $::N32H7_FPB_CTRL [expr {$_fpb_ctrl | 0x3}]

        # 4. release + reset back to back -- one transaction apart. C_HALT=0 is mandatory
        #    here (with it set boot never runs) but must not come any earlier: see (a).
        mww $::N32H7_DBG_DHCSR 0xA05F0001
        poll off
        if {[catch {mww $::N32H7_SCS_AIRCR 0x05FA0004} _e2]} {
            # Expected: the reset drops the SWD link mid-transfer, so the DAP answers JUNK
            # (measured "SWD ack not OK @ 3 JUNK"). Step 5 settles it.
            echo "  note: AIRCR write: $_e2 -- expected, reset drops the SWD link mid-transfer"
        }

        # 4b. BOOT holds AP0 disabled (CSW.DeviceEn) past that sleep -- the old HID firmware
        #     was only pushed beyond it by its JUNK on the AIRCR write. Touching AP0 first
        #     latches STICKYERR, so wait it out.
        _n32h7_wait_ap0 4000 post-reset

        # 5. the FPB match halted at the app entry; C_DEBUGEN|C_HALT clears a lockup
        #    from there being no valid image.
        mww $::N32H7_DBG_DHCSR 0xA05F0003

        # 6. S_RESET_ST clears on read
        set _dh [mrw $::N32H7_DBG_DHCSR]
        set _t0 [clock milliseconds]
        while {[expr {$_dh & 0x02000000}] && [expr {[clock milliseconds] - $_t0}] < 3000} {
            sleep 1
            set _dh [mrw $::N32H7_DBG_DHCSR]
        }

        # 7. Undo the trap verbatim; never clear FP_CTRL.ENABLE (OpenOCD caches it and
        #    that would kill every hardware breakpoint for the session).
        catch {mww $_fpb_comp $_fpb_comp_saved}
        mww $::N32H7_FPB_CTRL [expr {$_fpb_ctrl | 0x3}]
    } _msg]
    # Undo the trap even if it threw: a stale comparator halts the core on the next reset.
    if {[info exists _fpb_comp] && [info exists _fpb_comp_saved] && [info exists _fpb_ctrl]} {
        catch {mww $_fpb_comp $_fpb_comp_saved}
        catch {mww $::N32H7_FPB_CTRL [expr {$_fpb_ctrl | 0x3}]}
    }
    catch {poll on}
    if {$_err} {
        # Died half-way, most likely on a faulting AP access: disarm what it armed and
        # put the core back to running, so the next connect finds a chip that boots.
        catch {_n32h7_wipe_debug_domain reset-failed run}
        error $_msg
    }
}


proc n32h7_reset_halt {} {
    echo "N32H7 boot-aware reset (halt at app entry)"
    _n32h7_boot_reset
    # raw writes above bypassed OpenOCD's view of the core state
    if {[catch {halt} _m]} {
        echo "  note: halt after reset: $_m"
        poll
    }
    echo "  core halted."
}

# --- the first start after a flash program -------------------------------
# Measured with the exact Makefile flow: start #1 faults as HFSR=0x40000000 (FORCED) +
# CFSR=0x00000100 (IBUSERR, the first fetch out of the freshly written flash) and
# double-faults into lockup, while start #2 in the same session is clean, as is a fresh
# connection. The read-back verify reads that flash fine, so the transient sits at the end
# of the program. Retry once on that signature only; a genuine fault keeps its report.
proc _n32h7_startup_fault {} {
    set _hfsr 0
    set _cfsr 0
    if {[catch {
        set _hfsr [mrw $::N32H7_DBG_HFSR]
        set _cfsr [mrw $::N32H7_DBG_CFSR]
    }]} {
        return 0
    }
    return [expr {($_hfsr & 0x40000000) && ($_cfsr & 0x100)}]
}

# Release the core, then watch the startup window for that fault; `$retries` = how many
# further starts are allowed (0 = last one, report only).
proc _n32h7_start_app {retries} {
    catch {halt}
    # clear the sticky flags first, so what we read below belongs to THIS start
    catch {mww $::N32H7_DBG_HFSR 0x40000000}
    catch {mww $::N32H7_DBG_CFSR 0xFFFFFFFF}
    resume
    echo "  core running."
    if {$retries <= 0} {
        return
    }
    sleep $::N32H7_STARTUP_WINDOW_MS
    if {![_n32h7_startup_fault]} {
        return
    }
    echo "  note: app faulted right after the first start following a flash program"
    echo "  note: (HFSR.FORCED + CFSR.IBUSERR, measured); running the boot sequence once more"
    _n32h7_boot_reset
    if {[catch {halt} _m]} {
        echo "  note: halt after reset: $_m"
        poll
    }
    _n32h7_start_app [expr {$retries - 1}]
}


proc n32h7_reset_run {} {
    echo "N32H7 boot-aware reset (run to app)"
    _n32h7_boot_reset
    if {[catch {halt} _m]} {
        echo "  note: halt after reset: $_m"
        poll
    }
    _n32h7_start_app 1
}

proc n32h7_reset_init {} {
    n32h7_reset_halt
    _n32h7_reset_init_handler
}

# Route `reset` through the boot-aware flow for the Makefile / cortex-debug call sites. A
# plain `proc reset` does NOT work (OpenOCD re-registers it during `init`), so wrap `init`.
if {[info commands init] eq "init"} {
    rename init _n32h7_oocd_init
} else {
    error "internal: expected OpenOCD 'init' command to exist"
}
proc init {args} {
    eval _n32h7_oocd_init $args
    # `init` ends in EXEC mode, the earliest point where mrw/mww work.
    if {[info exists ::_n32h7_examined]} {
        # Record the previous session's leftovers BEFORE touching them: the only place a
        # killed session's state is visible, and what names the culprit when a board wedges.
        catch {_n32h7_dump_debug_domain after-examine}
        # Disarm them before this session arms anything of its own; DHCSR stays OpenOCD's.
        catch {_n32h7_clear_traps after-examine}
    } else {
        echo "N32H7: target did not examine -- it is not reachable yet."
        echo "N32H7: if this board was just debugged, its debug domain still holds"
        echo "N32H7: a halt request that outlives nRESET and SYSRESETREQ, and only"
        echo "N32H7: a power-on reset clears it: power-cycle the board."
        echo "N32H7: (see the debug-domain notes in this file)"
    }
    # the stock `reset` exists by now; take it over
    if {![info exists ::_n32h7_override_installed]} {
        set ::_n32h7_override_installed 1
        if {[info commands reset] eq "reset"} {
            rename reset _n32h7_oocd_reset
        }
        proc reset {args} {
            switch -- [lindex $args 0] {
                ""      { n32h7_reset_run }
                "halt"  { n32h7_reset_halt }
                "run"   { n32h7_reset_run }
                "init"  { n32h7_reset_init }
                default {
                    if {[llength [info commands _n32h7_oocd_reset]] > 0} {
                        eval _n32h7_oocd_reset $args
                    } else {
                        error "reset: unsupported argument(s): $args"
                    }
                }
            }
        }
        echo "N32H7: boot-aware reset override installed (reset halt/run/init)."
    }
}
