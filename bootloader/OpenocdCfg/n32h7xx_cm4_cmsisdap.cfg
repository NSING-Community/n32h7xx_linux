# OpenOCD config: n32h7xx dual-core, CM4 side (CMSIS-DAP).
# flash_op.bin is loaded into CM4 SRAM and driven via BKPT-based function calls.
#
# Usage:
#   Download: openocd -f xxxx_cmsisdap.cfg -c "init" -c "reset halt" -c "flash_program_bin <file.bin>" -c "reset run" -c "shutdown"
#   Debug:    openocd -f xxxx_cmsisdap.cfg
#   Erase:    openocd -f xxxx_cmsisdap.cfg -c "init" -c "reset halt" -c "flash_mass_erase" -c "reset run" -c "shutdown"
#
# reset halt/run/init are redefined at the end of this file to drive a
# core-local M4 VECTRESET, leaving the M7 untouched.

adapter driver cmsis-dap

# NSLink 0x19F5/0x3106; stock CMSIS-DAP 0xC251/0xF001; DAPLink 0x0D28/0x0204
if {![info exists ADAPTER_VID]} { set ADAPTER_VID 0x19F5 }
if {![info exists ADAPTER_PID]} { set ADAPTER_PID 0x3106 }
if {[catch {adapter usb vid_pid $::ADAPTER_VID $::ADAPTER_PID}]} {
    cmsis_dap_vid_pid $::ADAPTER_VID $::ADAPTER_PID
}

transport select swd
source [find mem_helper.tcl]        ;# mrw/mww/mdw

adapter speed 1000
## NTFx CODE START ##

# --- Target: N32H787XIB7 (Cortex-M4) ---
set _CHIPNAME n32h7xx

# ============================================================
# Flash geometry from FlashDev.c
#   Flash start:  0x15000000
#   Flash size:  0x3E0000
#   Sector size: 0x1000 
# ============================================================
set FLASH_START 0x15000000   
set FLASH_SIZE  0x3E0000
set FLASH_PAGE  0x1000  

# ============================================================
# FlashOS SRAM Algorithm 
#
# Loaded into system memory at 0x30000000.
#
# Function addresses:
#   Init        0x3000003D
#   UnInit      0x3000006D
#   EraseChip   0x30000085
#   EraseSector 0x300000D5
#   ProgramPage 0x30000129
#   Verify      0x30000185
# ============================================================
set FLASH_ALGO_BIN    "OpenocdCfg/cm4_flash_op/flash_op.bin"
set FLASH_ALGO_BASE   0x30000000

set FOS_Init          0x3000003D
set FOS_UnInit        0x3000006D
set FOS_EraseChip     0x30000085
set FOS_EraseSector   0x300000D5
set FOS_ProgramPage   0x30000129
set FOS_Verify       0x30000185

# SRAM working area layout:
#     0x30000000- 0x30000210 : flash_op algorithm
#     0x30000211 - 0x30000FDF : unused margin
#     0x30000FE0             : temp stack top (grows downward)
#     0x30000FF0             : BKPT instruction for function return
#     0x30001000 - 0x30005000 : image data buffer (up to FOS_BUF_SIZE per run)
set FOS_BUF_ADDR      0x30001000
set FOS_BUF_SIZE      0x4000  
set FOS_STACK_TOP     0x30000FE0
set FOS_BKPT_ADDR     0x30000FF0

## NTFx CODE END ##
set _ENDIAN little

# Standard Cortex-M4 IDCODE: 0x2BA01477. Remove -expected-id if chip uses different ID
swd newdap $_CHIPNAME dp -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x2BA01477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.dp

# M4 is created first, so it stays the default current target.
set _M4TGT $_CHIPNAME.m4
set _M7TGT $_CHIPNAME.m7

# BOTH targets are deferred. While the CM4 sits in reset-hold (0x58030174 = 0)
# every AP2 access stalls, so `init` must NOT auto-examine it. Required order
# (DFP DebugPortStart): examine M7 (AP0) -> release CM4 over the M7 bus ->
# examine CM4 (AP2). _N32H7xx_m4_connect does this at the end of init.
target create $_M4TGT cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 2 -defer-examine
target create $_M7TGT cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 0 -defer-examine

reset_config srst_nogate

# Delay before the first examination so a connected nRESET wire cannot break
# `init`: NSLink toggles its nRESET pin during DAP_Connect, which pin-resets the
# target, and the examination that follows lands in the ~100 ms boot window where
# AHB-AP accesses fault ("Failed to read memory at 0xe000ed00"). Measured on this
# board: 0-80 ms fails, >=120 ms passes. 0 = off (4-wire SWD, no nRESET wire).
# Applied in _N32H7xx_m4_connect, NOT via an examine-start event: arp_examine calls
# target->type->examine() directly and never fires that event.
set N32H7_EXAMINE_DELAY_MS 200

$_M4TGT configure -event gdb-attach {
    halt 1000
}
# End-of-session hygiene for whichever core GDB was attached to, fired from
# gdb_connection_closed() (not GDB's `D`). cortex-debug waits only 100 ms here, so keep
# it short; the same cleanup also runs from _run_pre_shutdown_commands().
$_M4TGT configure -event gdb-detach {
    catch {_use_m4}
    catch {_N32H7xx_session_end m4-detach}
    catch {resume}
}
$_M7TGT configure -event gdb-detach {
    catch {_use_m7}
    catch {_N32H7xx_session_end m7-detach}
    catch {resume}
}

# Shared / control registers (from Nationstech.N32H7xx_DFP.pdsc).
# The SCS/Debug ones are per-core, reached through the core's own AP.
#   AIRCR 0xE000ED0C bit2 SYSRESETREQ, bit0 VECTRESET
#   DHCSR 0xE000EDF0          DEMCR 0xE000EDFC bit0 VC_CORERESET
#   FP_COMP0 0xE0002008 + 4*n         FP_CTRL 0xE0002000 (bit0 ENABLE, bit1 KEY)
#   CM4 reset hold/release (M7 bus side) 0x58030174: bit0 0 = held, 1 = released
set N32H7_DBG_DHCSR   0xE000EDF0
set N32H7_DBG_DEMCR   0xE000EDFC
set N32H7_DBG_CFSR    0xE000ED28     ;# configurable fault status, all flags sticky W1C
set N32H7_DBG_HFSR    0xE000ED2C     ;# hard fault status, FORCED(30) is W1C
set N32H7_STARTUP_WINDOW_MS 200      ;# window for the post-program startup fault (below)
set N32H7_SCS_AIRCR   0xE000ED0C
set N32H7_FPB_CTRL    0xE0002000
set N32H7_FPB_COMP0   0xE0002008
set N32H7_DWT_CTRL    0xE0001000
set N32H7_DWT_COMP0   0xE0001020
set N32H7_DWT_FUNC0   0xE0001028
set N32H7_CM4_RELEASE 0x58030174

# DFP releaseM4AndHaltM7 peripheral pulse-reset list (download only)
set ::N32H7xx_RST_PULSE {
    {0x58030064 0x30710001}
    {0x58030068 0x00000001}
    {0x5803006c 0x01010101}
    {0x58030070 0x00000101}
    {0x58030094 0x11111111}
    {0x58030098 0x11111111}
    {0x5803009c 0x11111111}
    {0x580300a0 0x11111111}
    {0x580300a4 0x11111111}
    {0x580300d4 0x11111111}
    {0x580300d8 0x11111111}
    {0x580300dc 0x11111111}
    {0x580300e0 0x11111100}
    {0x58030104 0x11111111}
    {0x58030108 0x11111100}
    {0x58030150 0x11111111}
    {0x58030154 0x31010101}
    {0x58030158 0x00000001}
    {0x5803015c 0x00310000}
    {0x580300b4 0x03710101}
}

# Debug-domain hygiene: never leave a halt request behind (either core).
#
# DHCSR (C_DEBUGEN/C_HALT), DEMCR and the FPB/DWT comparators live in each core's debug
# domain, which survives nRESET AND SYSRESETREQ -- only a power-on reset clears it. Three
# ways a core ends up stopped: a latent DEMCR.VC_CORERESET (how a Cortex-M `reset halt`
# works, so an aborted flow or a killed session leaves the arm behind), DHCSR.C_HALT, and a
# leftover FPB/DWT comparator aimed into the boot ROM.
#
# A core stopped before the boot ROM finishes never releases the AHB-AP, so later accesses
# fault "Failed to read memory at 0xe000ed00"; an M7 stopped in boot also never releases the
# CM4, so AP2 goes down with AP0. NSLink's nRESET pulse during DAP_Connect turns a latent arm
# into a halt before any Tcl runs -- also why removing the nRESET wire "fixes" it. The
# end-of-session cleanup writes DHCSR = 0xA05F0000, whose C_DEBUGEN gate makes any missed bit
# inert.

# Print what is about to be wiped, on the CURRENT target: the last moment the leftover
# state is readable, so a wedged board can be diagnosed from the log.
proc _N32H7xx_dump_debug_domain {tag} {
    set _s ""
    foreach {_n _a} [list DHCSR $::N32H7_DBG_DHCSR DEMCR $::N32H7_DBG_DEMCR \
                          FPB_CTRL $::N32H7_FPB_CTRL] {
        if {[catch {set _v [mrw $_a]}]} {
            append _s " $_n=?"
        } else {
            append _s [format " $_n=%08X" $_v]
        }
    }
    # Read the PC only in Debug state: on a running core `reg pc` prints a spurious
    # "Could not read register 'pc'". On a stopped core it is the most useful value here.
    set _dh 0
    catch {set _dh [mrw $::N32H7_DBG_DHCSR]}
    if {($_dh & 0x20000)} {
        # `reg` returns a LIST, not a number -- take its last element, or format() throws
        # and the whole dump is lost (measured on a halted core).
        set _pc ""
        catch {set _pc [lindex [reg pc] end]}
        if {[regexp {^(0x[0-9a-fA-F]+|[0-9]+)$} $_pc]} {
            append _s [format " PC=%08X" $_pc]
        }
    }
    echo "N32H7xx: debug domain before cleanup ($tag):$_s"
    # The halt request the values above cannot show, and the one a killed session is most
    # likely to leave armed. Counted: FPB entries while FP_CTRL.ENABLE is set, DWT ones when
    # FUNCTION[3:0] != 0. Measured here, DWT_FUNCTION1 holds 0x200 and rejects a 0 write
    # (DWT_LSR = 0), and FUNCTION = 0 cannot halt anything -- counting it would cry wolf.
    set _nz {}
    catch {
        set _ctrl [mrw $::N32H7_FPB_CTRL]
        set _num [expr {(($_ctrl >> 8) & 0x70) | (($_ctrl >> 4) & 0xF)}]
        if {($_ctrl & 0x1) && $_num >= 1 && $_num <= 8} {
            for {set _i 0} {$_i < $_num} {incr _i} {
                set _c [mrw [expr {$::N32H7_FPB_COMP0 + 4 * $_i}]]
                if {$_c != 0} { lappend _nz [format "FPB%d=%08X" $_i $_c] }
            }
        }
        set _nw [expr {([mrw $::N32H7_DWT_CTRL] >> 28) & 0xF}]
        for {set _i 0} {$_i < $_nw} {incr _i} {
            set _f [mrw [expr {$::N32H7_DWT_FUNC0 + 0x10 * $_i}]]
            if {($_f & 0xF) != 0} {
                set _c [mrw [expr {$::N32H7_DWT_COMP0 + 0x10 * $_i}]]
                lappend _nz [format "DWT%d=FUNC%08X/COMP%08X" $_i $_f $_c]
            }
        }
    }
    if {[llength $_nz]} {
        echo "N32H7xx: comparators left ARMED by an earlier session ($tag): [join $_nz { }]"
    } else {
        echo "N32H7xx: no comparator left armed ($tag)."
    }
}

# Disarm every halt request on the CURRENT target (callers select it first); returns 0,
# or 1 if anything failed (callers report that as a note only).
#   run   -> DHCSR = 0xA05F0001 (keep control, core running)
#   end   -> DHCSR = 0xA05F0000 (gate off, end of session only; also releases a halted
#            core, since clearing C_DEBUGEN exits Debug state)
#   traps -> DHCSR untouched (the halt state stays OpenOCD's)
proc _N32H7xx_wipe_debug_domain {tag {mode run}} {
    set _why {}
    if {$mode ne "traps"} {
        set _dhcsr [expr {$mode eq "end" ? 0xA05F0000 : 0xA05F0001}]
        if {[catch {mww $::N32H7_DBG_DHCSR $_dhcsr} _e]} {
            lappend _why "DHCSR:$_e"
        }
    }
    # Every vector catch, not just VC_CORERESET -- the others stop the core inside boot
    # too. Mask 0xFFF clears the whole 0..11 field, leaving MON_EN(16)/TRCENA(24) alone.
    if {[catch {
        set _demcr [mrw $::N32H7_DBG_DEMCR]
        mww $::N32H7_DBG_DEMCR [expr {$_demcr & ~0xFFF}]
    } _e]} {
        lappend _why "DEMCR:$_e"
    }
    # Keep FP_CTRL.ENABLE: OpenOCD's cache means clearing it here kills every hardware
    # breakpoint for the rest of the session.
    if {[catch {
        set _ctrl [mrw $::N32H7_FPB_CTRL]
        # NUM_CODE spans FP_CTRL[7:4] and [14:12] (ARMv7-M FPB)
        set _num [expr {(($_ctrl >> 8) & 0x70) | (($_ctrl >> 4) & 0xF)}]
        if {$_num < 1 || $_num > 8} { set _num 6 }
        for {set _i 0} {$_i < $_num} {incr _i} {
            mww [expr {$::N32H7_FPB_COMP0 + 4 * $_i}] 0
        }
        mww $::N32H7_FPB_CTRL [expr {$_ctrl | 0x3}]
    } _e]} {
        lappend _why "FPB:$_e"
    }
    # Watchpoints: cortex-debug's liveWatch arms DWT comparators, same POR-only
    # domain as the FPB. DWT_CTRL[31:28] = NUMCOMP.
    if {[catch {
        set _numwp 4                       ;# Cortex-M7 implements 4 watchpoints
        if {![catch {set _dwctrl [mrw $::N32H7_DWT_CTRL]}]} {
            set _numwp [expr {($_dwctrl >> 28) & 0xF}]
        }
        for {set _i 0} {$_i < $_numwp} {incr _i} {
            # FUNCTION=0 disables the comparator; COMP is zeroed for tidiness
            mww [expr {$::N32H7_DWT_FUNC0 + 0x10 * $_i}] 0
            mww [expr {$::N32H7_DWT_COMP0 + 0x10 * $_i}] 0
        }
    } _e]} {
        lappend _why "DWT:$_e"
    }
    if {[llength $_why]} {
        echo "  note: debug-domain wipe incomplete ($tag): $_why"
        return 1
    }
    return 0
}

# Disarm the traps, leave DHCSR alone -- used right after a successful examine, so
# a comparator left by a killed session cannot bite on the next reset.
proc _N32H7xx_clear_traps {tag} {
    return [_N32H7xx_wipe_debug_domain $tag traps]
}

# A core stopped on one of our own BKPTs cannot simply be released: with debugging off a
# BKPT is an unexpected exception, so the release runs it, HardFaults from a stack the
# algorithm owns and double-faults into lockup -- the cleanup wedging the core in exactly the
# aborted-flash_program_bin case it exists for. Park it on a "b ." in SRAM first; only a
# halted core inside one of the two RAM algorithms is touched.
#
# Re-pointing at the app entry does not work instead (measured on the CM7 path): with
# C_DEBUGEN cleared the first fetch from flash faults anyway (CFSR 0x100 IBUSERR, HFSR
# 0xC0000000). Parking is clean -- DHCSR = 0x01010000, HFSR/CFSR 0, held for 800 ms. Caveat:
# an interrupt while parked would vector through VTOR into flash and fault (PRIMASK cannot be
# set from a halt); nothing fired in 800 ms here and the state is transient.
proc _N32H7xx_release_safe {} {
    if {[catch {set _dh [mrw $::N32H7_DBG_DHCSR]}]} { return }
    if {!($_dh & 0x2)} { return }                    ;# C_HALT: only a stopped core
    # `reg` returns a LIST, not a number; comparing it against the windows below is a
    # string compare that silently skips every core this exists to rescue. Take the value.
    set _pc ""
    catch {set _pc [lindex [reg pc] end]}
    if {![regexp {^(0x[0-9a-fA-F]+|[0-9]+)$} $_pc]} { return }
    # Both windows must be checked because this config can drive either core: the
    # CM7 algorithm lives at 0x24000000, the CM4's at 0x30000000.
    set _in_algo 0
    if {$_pc >= 0x24000000 && $_pc < 0x24005000} { set _in_algo 1 }
    if {$_pc >= $::FLASH_ALGO_BASE && $_pc < [expr {$::FLASH_ALGO_BASE + 0x5000}]} { set _in_algo 1 }
    if {!$_in_algo} { return }
    # Point it at a "b ." so the release spins in SRAM instead of executing that BKPT. Safe
    # to clobber: the RAM algorithm is reloaded by every session that needs it. SP is left
    # alone -- it points into the algorithm's own valid SRAM stack, unused by the loop.
    catch {mww [expr {$_pc & 0xFFFFFFFC}] 0xBF00E7FE}
    catch {reg pc [expr {($_pc & 0xFFFFFFFC) | 0x1}]}
    echo "  note: core was halted in the flash algorithm -- parked in a spin loop before release"
}

# End-of-session cleanup for one core; never-examined cores are skipped, since touching
# AP2 while the CM4 is held in reset stalls the whole link.
proc _N32H7xx_cleanup_target {tgt tag} {
    if {[catch {set _examined [$tgt was_examined]}]} { return }
    if {!$_examined} { return }
    catch {targets $tgt}
    catch {_N32H7xx_dump_debug_domain $tag}
    catch {_N32H7xx_release_safe}
    _N32H7xx_wipe_debug_domain $tag end
}

# Whichever core GDB was attached to is the one that matters, but a download
# session halts the M7 as well, so clean both (each skipping the unexamined ones).
proc _N32H7xx_session_end {tag} {
    global _M4TGT _M7TGT
    catch {_N32H7xx_cleanup_target $_M4TGT $tag-m4}
    catch {_N32H7xx_cleanup_target $_M7TGT $tag-m7}
}

# Runs on every shutdown (handle_shutdown_command(), and on CTRL-C), so it covers the
# `-c "shutdown"` ending every Makefile flow and the aborted-download case: `reset halt`
# leaves a core halted at the app entry, and if flash_program_bin then fails, `reset run`
# never comes.
proc _run_pre_shutdown_commands {} {
    global _M4TGT _M7TGT
    catch {_N32H7xx_cleanup_target $_M4TGT pre-shutdown-m4}
    catch {_N32H7xx_cleanup_target $_M7TGT pre-shutdown-m7}
}

# 1 == THIS session halted the M7 during download prep, so the final "reset run"
# must release it again (both cores end up running).
set ::_N32H7xx_m7_halted 0

proc _use_m4 {} {
    global _M4TGT
    catch {targets $_M4TGT}
}
proc _use_m7 {} {
    global _M7TGT
    catch {targets $_M7TGT}
}

# Download prep, mirroring DFP DebugPortStart(CM4) + releaseM4AndHaltM7:
# halt M7 so its DMA cannot corrupt flash ops, pulse-reset every peripheral,
# then release M4 from reset-hold while C_HALT is set so it stays stopped.
proc _N32H7xx_m7_halt {} {
    global _M7TGT
    set ::_N32H7xx_m7_halted 0

    # M7 is defer-examined: bring it up only when needed
    if {![catch {$_M7TGT was_examined} w] && !$w} {
        if {[catch {$_M7TGT arp_examine} e]} {
            echo "  warning: could not examine M7 control target ($e) --"
            echo "           proceeding WITHOUT halting M7"
            return
        }
    }
    _use_m7
    if {[catch {mww $::N32H7_DBG_DHCSR 0xA05F0003} e]} {
        echo "  warning: M7 halt (AP0 DHCSR) write failed: $e"
        _use_m4
        return
    }
    # wait for S_HALT: the peripheral resets below must not race a running M7
    set _t0 [clock milliseconds]
    set _s 0
    catch {set _s [expr {[mrw $::N32H7_DBG_DHCSR] & 0x20000}]}
    while {!$_s && [expr {[clock milliseconds] - $_t0}] < 500} {
        sleep 1
        set _s 0
        catch {set _s [expr {[mrw $::N32H7_DBG_DHCSR] & 0x20000}]}
    }
    if {$_s} {
        echo "  M7 halted (S_HALT set)."
    } else {
        echo "  note: M7 did not report S_HALT within 500 ms -- continuing."
    }
    set ::_N32H7xx_m7_halted 1
    _use_m4
}

# Undo _N32H7xx_m7_halt. Only acts if THIS session halted M7.
proc _N32H7xx_m7_resume {} {
    global _M7TGT
    if {!$::_N32H7xx_m7_halted} {
        return
    }
    _use_m7
    if {[catch {mww $::N32H7_DBG_DHCSR 0xA05F0001} e]} {
        echo "  note: M7 resume (AP0 DHCSR) write failed: $e"
    } else {
        echo "  M7 released (resumed from where it was halted)."
    }
    set ::_N32H7xx_m7_halted 0
    _use_m4
}

proc _N32H7xx_periph_reset {} {
    # the reset block is reachable only from the M7 bus side
    _use_m7
    foreach item $::N32H7xx_RST_PULSE {
        set a [lindex $item 0]
        set v [lindex $item 1]
        catch {mww $a $v}
    }
    # deassert: clearing every line forms the pulse
    foreach item $::N32H7xx_RST_PULSE {
        set a [lindex $item 0]
        catch {mww $a 0x00000000}
    }
    _use_m4
}

proc _N32H7xx_m4_download_prep {} {
    echo "N32H7xx CM4 download prep (DFP: halt M7 + periph reset + release M4)"
    # keep M4 stopped even while it is still held
    _use_m4
    catch {mww $::N32H7_DBG_DHCSR 0xA05F0003}
    _N32H7xx_m7_halt
    _N32H7xx_periph_reset
    # M4 is debug-halted, so leaving reset-hold cannot let it run away
    _use_m7
    catch {mww $::N32H7_CM4_RELEASE 0x00000001}
    _use_m4
    echo "  M7 halted, peripherals reset, M4 released + halted."
}

# M4 core-local reset: only VECTRESET, since a real M4 system reset would drop
# the WHOLE chip. With DEMCR.VC_CORERESET set the core stops right after the
# reset vector -- the DFP's safe "halt at M4 entry" state. M7 is untouched.
proc _N32H7xx_m4_vectreset {run_mode} {
    global _M7TGT
    _use_m4

    if {[catch {mww $::N32H7_DBG_DHCSR 0xA05F0003} e]} {
        echo "  note: M4 halt before VECTRESET: $e"
    }

    # The release register 0x58030174 lives on the M7 bus side, so it is only
    # reachable once M7 is examined. In a pure M4 debug session M7 is never
    # examined and we assume the M7 app already released M4 (the common case).
    if {[catch {$_M7TGT was_examined} _wex] == 0 && $_wex} {
        _use_m7
        if {[catch {mww $::N32H7_CM4_RELEASE 0x00000001} e]} {
            echo "  note: CM4 release write failed ($e)"
        }
        _use_m4
    } else {
        echo "  note: M7 not examined -- M4 release register left as-is."
    }

    set _demcr 0
    catch {set _demcr [mrw $::N32H7_DBG_DEMCR]}
    catch {mww $::N32H7_DBG_DEMCR [expr {$_demcr | 0x1}]}   ;# VC_CORERESET on

    poll off
    if {[catch {mww $::N32H7_SCS_AIRCR 0x05FA0001} e]} {    ;# VECTRESET
        echo "  note: VECTRESET write: $e -- expected, reset drops the SWD link mid-transfer"
    }
    # S_RESET_ST clears on read; 3 s timeout
    set _t0 [clock milliseconds]
    set _dh 0
    catch {set _dh [mrw $::N32H7_DBG_DHCSR]}
    while {[expr {$_dh & 0x02000000}] && [expr {[clock milliseconds] - $_t0}] < 3000} {
        sleep 1
        set _dh 0
        catch {set _dh [mrw $::N32H7_DBG_DHCSR]}
    }
    catch {poll on}

    # vector catch off, then settle into a clean debug-halted state (0xA05F0003
    # also clears S_LOCKUP when there is no valid M4 image)
    set _demcr 0
    catch {set _demcr [mrw $::N32H7_DBG_DEMCR]}
    catch {mww $::N32H7_DBG_DEMCR [expr {$_demcr & ~0x1}]}
    catch {mww $::N32H7_DBG_DHCSR 0xA05F0003}

    # re-sync OpenOCD's view of the M4 core (raw writes bypassed it)
    _use_m4
    if {[catch {halt} _m]} {
        echo "  note: halt after VECTRESET: $_m"
        poll
    }
    echo "  M4 core-local reset done, core halted."

    if {$run_mode eq "run"} {
        # clear the sticky flags first, so the post-start check sees only faults
        # that belong to THIS start
        catch {mww $::N32H7_DBG_HFSR 0x40000000}
        catch {mww $::N32H7_DBG_CFSR 0xFFFFFFFF}
        if {[catch {resume} _m]} {
            echo "  note: resume after reset: $_m"
        }
        echo "  M4 running."
    }
}

# --- the first start after a flash program --------------------------------
# Measured on the M7 side with the exact Makefile flow: start #1 ends in HFSR=0x40000000
# (FORCED) + CFSR=0x00000100 (IBUSERR, the app's first fetch out of the flash just written)
# and double-faults into lockup, while start #2 in the same session is clean
# (DHCSR=0x00010001, HFSR=CFSR=0), as is a fresh connection. The verify read-back of that
# flash reads fine, so the transient sits at the end of the flash program. The M4 runs from
# the same flash, so the same signature is retried once here -- keyed on the measured status
# bits alone, and a genuine M4 fault keeps its first report.
proc _N32H7xx_m4_check_startup {retries} {
    if {$retries <= 0} {
        return
    }
    sleep $::N32H7_STARTUP_WINDOW_MS
    set _hfsr 0
    set _cfsr 0
    if {[catch {
        set _hfsr [mrw $::N32H7_DBG_HFSR]
        set _cfsr [mrw $::N32H7_DBG_CFSR]
    }]} {
        return
    }
    if {!($_hfsr & 0x40000000) || !($_cfsr & 0x100)} {
        return
    }
    echo "  note: M4 app faulted right after the first start following a flash program"
    echo "  note: (HFSR.FORCED + CFSR.IBUSERR); running the reset once more"
    _N32H7xx_m4_vectreset run
    _N32H7xx_m4_check_startup [expr {$retries - 1}]
}

proc N32H7xx_m4_reset_halt {} {
    echo "N32H7xx CM4 reset halt (core-local VECTRESET, M7 untouched)"
    _N32H7xx_m4_vectreset halt
}

proc N32H7xx_m4_reset_run {} {
    echo "N32H7xx CM4 reset run (core-local VECTRESET)"
    _N32H7xx_m4_vectreset run
    _N32H7xx_m4_check_startup 1
    # release the M7 if download prep in THIS session halted it, so the
    # dual-core system ends up running
    _N32H7xx_m7_resume
    echo "  done."
}

proc _safe_load_image {file addr} {
    if {[catch {load_image $file $addr} msg]} {
        puts "  load_image Fail: $msg"
        puts "  Please disconnect and reconnect the debugger, then try again,"
        error $msg
    }
}

proc flashos_load {} {
    if {![file exists $::FLASH_ALGO_BIN]} {
        error "Flash algorithm binary not found: $::FLASH_ALGO_BIN"
    }
    puts "Loading $::FLASH_ALGO_BIN to [format 0x%08X $::FLASH_ALGO_BASE]..."
    _safe_load_image $::FLASH_ALGO_BIN $::FLASH_ALGO_BASE

    set first_word [mrw $::FLASH_ALGO_BASE]
    puts "Algorithm @ [format 0x%08X $::FLASH_ALGO_BASE]: [format 0x%08X $first_word]"
    if {$first_word == 0 || $first_word == 0xFFFFFFFF} {
        error "Flash algorithm not loaded correctly: first word = [format 0x%08X $first_word]"
    }
}

# OpenOCD >= 0.12 lowercases register names ("xpsr"), older versions use
# "xPSR". Probed once (target must be halted) and cached.
set ::XPSR_REG ""
proc _xpsr_regname {} {
    if {$::XPSR_REG eq ""} {
        if {![catch {reg xPSR}]} {
            set ::XPSR_REG xPSR
        } else {
            set ::XPSR_REG xpsr
        }
    }
    return $::XPSR_REG
}

# Call a FlashOS function in SRAM -- see the M7 config for the mechanism and
# for why BKPT + LR must be re-armed before every call.
# All flash functions return 0 = OK, 1 = Failed.
proc flashos_call {func_addr args} {
    mww $::FOS_BKPT_ADDR 0x0000BE00
    reg sp $::FOS_STACK_TOP

    # ARM EABI: first 4 args in R0-R3, the rest zeroed
    set regs {r0 r1 r2 r3}
    set i 0
    foreach val $args {
        reg [lindex $regs $i] $val
        incr i
        if {$i >= 4} { break }
    }
    for {} {$i < 4} {incr i} {
        reg [lindex $regs $i] 0
    }

    reg lr [expr {$::FOS_BKPT_ADDR | 1}]

    # T=1 is mandatory: "reset halt" leaves the core with xPSR.T=0, and the
    # first fetch would fault (INVSTATE) before the function runs.
    reg [_xpsr_regname] 0x01000000

    reg pc $func_addr
    resume

    wait_halt 15000                       ;# generous: covers flash erase

    set ret_raw [reg r0]
    set ret 0
    if {![regexp {(0x[0-9a-fA-F]+)} $ret_raw -> ret_hex]} {
        set ret_hex $ret_raw
    }
    set ret [expr {$ret_hex}]
    return $ret
}

proc flashos_init {} {
    set ret [flashos_call $::FOS_Init 0x08000000 0 1]
    if {$ret != 0} {
        puts "FlashOS Init failed with return code $ret"
        error "FlashOS Init returned $ret"
    }
    puts "FlashOS Init OK."
}

proc flashos_uninit {} {
    flashos_call $::FOS_UnInit 0
    puts "FlashOS UnInit OK."
}

proc flashos_erase_sector {addr} {
    set ret [flashos_call $::FOS_EraseSector $addr]
    if {$ret != 0} {
        puts "FlashOS EraseSector @ [format 0x%08X $addr] failed with return code $ret"
        error "FlashOS EraseSector failed"
    }
}

# WARNING: erases the whole shared bank (both cores). The DFP algorithm covers
# 0x15000000..0x151DFFFF on one 2 MB array.
proc flash_mass_erase {} {
    _N32H7xx_m4_download_prep
    set ret [flashos_call $::FOS_EraseChip]
    if {$ret != 0} {
        puts "FlashOS EraseChip failed with return code $ret"
        error "FlashOS EraseChip returned $ret"
    }
    puts "Mass erase complete (whole shared bank)."
}

proc _N32H7xx_m4_reset_init_handler {} {
    _use_m4
    flashos_load
    flashos_init
    echo "N32H7xx CM4 initialized (flash algorithm loaded, FlashOS Init called)"
}

$_M4TGT configure -event reset-init {
    _N32H7xx_m4_reset_init_handler
}

# Stage one chunk in SRAM via a temp file: a bulk load_image beats a
# word-by-word mww loop.
proc _sram_load_chunk {bin_file offset size dst_addr} {
    # Binary offsets are bytes. Jim string range indexes characters and silently
    # skips bytes in ARM machine code after the first chunk.
    set tmp "_chunk_tmp.bin"
    set src [open $bin_file rb]
    fconfigure $src -translation binary
    seek $src $offset start
    set chunk [read $src $size]
    close $src
    set fh [open $tmp wb]
    fconfigure $fh -translation binary
    puts -nonewline $fh $chunk
    close $fh
    if {[file size $tmp] != $size} {
        file delete $tmp
        error "Short binary chunk: offset=$offset expected=$size"
    }
    _safe_load_image $tmp $dst_addr
    file delete $tmp
}

# Chunked CM4 programmer: download prep, load algo, erase all affected
# sectors, then program + verify FOS_BUF_SIZE at a time.
proc _host_verify_image {bin_file start_addr len} {
    set readback "${bin_file}.readback-[clock milliseconds].bin"
    dump_image $readback $start_addr $len
    set f [open $bin_file rb]
    fconfigure $f -translation binary
    set expected [read $f]
    close $f
    set f [open $readback rb]
    fconfigure $f -translation binary
    set actual [read $f]
    close $f
    binary scan $expected c* expected_bytes
    binary scan $actual c* actual_bytes
    if {[llength $expected_bytes] != $len || [llength $actual_bytes] != $len ||
        $expected_bytes ne $actual_bytes} {
        error "Host image verification FAILED; readback kept at $readback"
    }
    puts "Host image verification PASS: $len bytes; readback $readback"
}

proc flash_program_bin {bin_file {start_addr 0x15000000}} {
    set _t0 [clock milliseconds]
    set page_size $::FLASH_PAGE
    set chunk_size $::FOS_BUF_SIZE
    puts "=========================================="
    puts "File: $bin_file"

    if {![file exists $bin_file]} {
        error "File not found: $bin_file"
    }
    if {$start_addr < $::FLASH_START} {
        error "start_addr 0x[format %08X $start_addr] is below the CM4 flash partition (>= 0x[format %08X $::FLASH_START]). Did you forget 0x15080000 for the M4 image?"
    }
    if {[expr {$start_addr & ($page_size - 1)}] != 0} {
        puts "start_addr must be $page_size-byte aligned, got [format 0x%08X $start_addr]"
        return
    }
    set len [file size $bin_file]
    if {$len == 0} {
        puts "File is empty: $bin_file"
        return
    }

    puts "Binary size: $len bytes"
    puts "Start address: [format 0x%08X $start_addr]"
    puts "Sector size: [format 0x%X $::FLASH_PAGE]"
    puts "=========================================="

    set end_addr [expr {$start_addr + $len}]
    if {$end_addr > [expr {$::FLASH_START + $::FLASH_SIZE}]} {
        puts "Binary too large: $len bytes (flash max $::FLASH_SIZE)"
        return
    }

    # quiet the other core + all peripherals before touching flash
    _N32H7xx_m4_download_prep

    _use_m4
    flashos_load
    flashos_init

    # ---- Phase 1: erase every affected sector ----
    puts "Erasing all affected sectors..."
    set sector_count 0
    for {set pa $start_addr} {$pa < $end_addr} {set pa [expr {$pa + $page_size}]} {
        puts "  Erasing sector @ [format 0x%08X $pa]"
        flashos_erase_sector $pa
        incr sector_count
    }
    puts "[expr {$sector_count}] sector(s) erased."

    # ---- Phase 2: program + verify ----
    puts "Programming and Verify..."
    for {set pa $start_addr} {$pa < $end_addr} {set pa [expr {$pa + $chunk_size}]} {
        set chunk_start [expr {$pa > $start_addr ? $pa : $start_addr}]
        set next_pa [expr {$pa + $chunk_size}]
        set chunk_end [expr {$next_pa < $end_addr ? $next_pa : $end_addr}]
        set chunk_sz [expr {$chunk_end - $chunk_start}]

        if {$chunk_sz <= 0} { continue }

        set src_offset [expr {$chunk_start - $start_addr}]
        _sram_load_chunk $bin_file $src_offset $chunk_sz $::FOS_BUF_ADDR

        set ret [flashos_call $::FOS_ProgramPage $chunk_start $chunk_sz $::FOS_BUF_ADDR]
        if {$ret != 0} {
            puts "ProgramPage @ [format 0x%08X $chunk_start] returned $ret"
            error "ProgramPage failed"
            return
        }

        set ret [flashos_call $::FOS_Verify $chunk_start $chunk_sz $::FOS_BUF_ADDR]
        if {$ret != 0} {
            puts "Verify failed @ [format 0x%08X $chunk_start] (returned $ret)"
            error "Verify failed"
            return
        }

        set progress [expr {($chunk_end - $start_addr) * 100 / $len}]
        puts "  $progress% (program+verify @ [format 0x%08X $chunk_start])"
    }

    flashos_uninit
    _host_verify_image $bin_file $start_addr $len

    set _el [expr {[clock milliseconds] - $_t0}]
    puts "Flash programming complete in [format %.1f [expr {$_el / 1000.0}]] s."
}

# Dual-core connect / bring-up, run at the end of `init`.
#
# The CM4 is often held in reset-hold (0x58030174 = 0) when the debugger
# attaches: after power-up / full-chip reset, or when the M7 app keeps it
# stopped. While held, AP2 stalls on EVERY access, so an `init` that
# auto-examines it fails with "Examination failed" / "stalled AP operation".
# Mirror the DFP CM4 DebugPortStart instead: reach the release register
# through the M7 bus (AP0), release the CM4, then talk to the CM4 core.
proc _N32H7xx_m4_connect {} {
    global _M7TGT _M4TGT
    echo "N32H7xx CM4 connect: bring up M7 (AP0), release CM4 if held..."
    # polling off while we hand-assemble the dual-core state: a just-released
    # CM4 with no valid image yet will lock up, and background poll would fight
    # the connect. Re-enabled below.
    catch {poll off}
    set _err 0

    # wait out the boot window that a DAP_Connect nRESET toggle just restarted
    if {$::N32H7_EXAMINE_DELAY_MS > 0} {
        sleep $::N32H7_EXAMINE_DELAY_MS
    }

    # M7 is never held in reset, and its bus owns the CM4 release register
    if {[catch {$_M7TGT arp_examine} e]} {
        echo "  warning: M7 (AP0) examine failed: $e"
        echo "           cannot reach CM4 release register 0x58030174 --"
        echo "           assuming the CM4 is already released."
        set ::_N32H7xx_m7_ok 0
    } else {
        set ::_N32H7xx_m7_ok 1
        _use_m7
        # Record what the previous session left on the M7 BEFORE touching it: a
        # session killed by the IDE runs no Tcl at its end, so this is the only
        # place its leftovers are still visible.
        catch {_N32H7xx_dump_debug_domain m7-after-examine}
        # Disarm those leftovers before this session arms anything. DHCSR is left
        # to OpenOCD ("traps" mode).
        _N32H7xx_wipe_debug_domain m7-traps traps
        set _hold 0
        catch {set _hold [mrw $::N32H7_CM4_RELEASE]}
        echo "  CM4 reset-hold register 0x58030174 = [format 0x%08X $_hold]"
        if {$_hold == 0 || $_hold == 0xFFFFFFFF} {
            echo "  CM4 is held in reset -- releasing (write 0x58030174 = 1)."
            if {[catch {mww $::N32H7_CM4_RELEASE 0x00000001} e]} {
                echo "  warning: CM4 release write failed: $e"
            } else {
                sleep 5
            }
        }
        _use_m4
    }

    echo "N32H7xx CM4 connect: examining CM4 (AP2)..."
    if {[catch {$_M4TGT arp_examine} e]} {
        echo "  ERROR: CM4 (AP2) examine failed: $e"
        echo "         chip may still be starting up -- retry the download,"
        echo "         or check that the M7 app has brought up the CM4 domain."
        set ::_N32H7xx_m4_ok 0
        set _err 1
    } else {
        echo "  CM4 examined OK."
        set ::_N32H7xx_m4_ok 1
        # Clear the CM4 debug domain before letting it stop: a stale C_HALT or FPB
        # comparator halts the CM4 mid-boot after every reset and the M7 app then
        # never releases it. Must come BEFORE the halt below -- the wipe leaves
        # C_HALT=0.
        _use_m4
        catch {_N32H7xx_dump_debug_domain m4-after-examine}
        _N32H7xx_wipe_debug_domain m4
        # halt right away: a freshly-released CM4 with no valid image would run
        # into a HardFault/lockup
        catch {$_M4TGT arp_halt}
    }

    catch {poll on}
    return $_err
}

# Route `reset` through the CM4 core-local flow, so the Makefile /
# cortex-debug call sites keep working unchanged.
#
# A plain `proc reset` here does NOT work: OpenOCD re-registers the stock
# `reset` during `init`, clobbering any earlier proc of the same name. `init`
# already exists while this file is parsed, so wrap IT instead.
if {[info commands init] eq "init"} {
    rename init _N32H7xx_m4_oocd_init
} else {
    error "internal: expected OpenOCD 'init' command to exist"
}
proc init {args} {
    # all targets are defer-examine, so init does not touch the (possibly
    # held-in-reset) CM4 -- that would stall on AP2
    eval _N32H7xx_m4_oocd_init $args
    # dual-core bring-up must run before any reset/halt/flash
    _N32H7xx_m4_connect
    # Report an unreachable chip. Nothing can be recovered from here: what blocks
    # the connection is a halt request in a POR-only domain, and the reset that
    # triggered it (NSLink's nRESET pulse) happens before any Tcl can run.
    if {![info exists ::_N32H7xx_m4_ok] || !$::_N32H7xx_m4_ok} {
        echo "N32H7xx: CM4 (AP2) did not come up."
        if {![info exists ::_N32H7xx_m7_ok] || !$::_N32H7xx_m7_ok} {
            echo "N32H7xx: nor did the M7 (AP0) -- if this board was just"
            echo "N32H7xx: debugged, its debug domain still holds a halt request"
            echo "N32H7xx: that outlives nRESET and SYSRESETREQ, and only a"
            echo "N32H7xx: power-on reset clears it: power-cycle the board."
            echo "N32H7xx: (see the debug-domain notes in this file)"
        } else {
            echo "N32H7xx: the M7 is up, so the chip is not wedged -- the CM4 may"
            echo "N32H7xx: simply not be released yet. Retry, or run the M7 app."
        }
    }
    # make sure the M4 target is the one every bare command acts on
    _use_m4
    # the stock `reset` is registered by now; take it over.
    if {![info exists ::_N32H7xx_m4_override_installed]} {
        set ::_N32H7xx_m4_override_installed 1
        if {[info commands reset] eq "reset"} {
            rename reset _N32H7xx_m4_oocd_reset
        }
        proc reset {args} {
            switch -- [lindex $args 0] {
                ""      { N32H7xx_m4_reset_run }
                "halt"  { N32H7xx_m4_reset_halt }
                "run"   { N32H7xx_m4_reset_run }
                "init"  { N32H7xx_m4_reset_init }
                default {
                    if {[llength [info commands _N32H7xx_m4_oocd_reset]] > 0} {
                        eval _N32H7xx_m4_oocd_reset $args
                    } else {
                        error "reset: unsupported argument(s): $args"
                    }
                }
            }
        }
        echo "N32H7xx CM4: core-local VECTRESET reset override installed."
    }
}

proc N32H7xx_m4_reset_init {} {
    N32H7xx_m4_reset_halt
    _N32H7xx_m4_reset_init_handler
}

